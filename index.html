<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Realm of Legends</title>
<style>
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;overflow:hidden;
 background:#090b14;font-family:Arial,sans-serif;
}
body{touch-action:none}
canvas{
 display:block;width:100vw;height:100vh;
 image-rendering:pixelated;
 image-rendering:crisp-edges;
}
</style>
</head>

<body>

<canvas id="game" width="960" height="540"></canvas>

<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
ctx.imageSmoothingEnabled=false;

const W=960,H=540;

let screen="title";
let selected=0;
let room="island";
let message="";
let msgTime=0;

const keys={};

const heroes=[
 {name:"Warrior",color:"#3b75c7",hp:150,mp:55},
 {name:"Mage",color:"#8149bd",hp:105,mp:100},
 {name:"Archer",color:"#3b9b63",hp:115,mp:75},
 {name:"Knight",color:"#b88a32",hp:175,mp:45}
];

/* =========================
   SWORDS
========================= */

const swords=[

 {
  name:"Iron Sword",
  rarity:"Common",
  color:"#d7d7d7",
  damage:8,
  ability:"Power Slash"
 },

 {
  name:"Forest Blade",
  rarity:"Uncommon",
  color:"#58b86a",
  damage:13,
  ability:"Vine Strike"
 },

 {
  name:"Crystal Sword",
  rarity:"Rare",
  color:"#5dc8ff",
  damage:19,
  ability:"Crystal Burst"
 },

 {
  name:"Shadow Blade",
  rarity:"Epic",
  color:"#b66cff",
  damage:27,
  ability:"Shadow Dash"
 },

 {
  name:"Dragon Sword",
  rarity:"Legendary",
  color:"#ffd34e",
  damage:39,
  ability:"Dragon Flame"
 },

 {
  name:"Celestial Blade",
  rarity:"Mythic",
  color:"#ff75d1",
  damage:55,
  ability:"Heavenly Strike"
 }

];

let owned=[0];
let equipped=0;

/* =========================
   PLAYER
========================= */

let player={
 x:470,
 y:320,
 hp:150,
 mp:55
};

let enemies=[
 {x:650,y:260,hp:50,max:50,type:"slime"},
 {x:760,y:350,hp:70,max:70,type:"wolf"},
 {x:350,y:180,hp:45,max:45,type:"slime"}
];

/* =========================
   DRAW HELPERS
========================= */

function rect(x,y,w,h,color){
 ctx.fillStyle=color;
 ctx.fillRect(x,y,w,h);
}

function text(t,x,y,size=16,color="#fff"){
 ctx.font="bold "+size+"px Arial";
 ctx.fillStyle=color;
 ctx.fillText(t,x,y);
}

function panel(x,y,w,h,color="#151a28",stroke="#c9a85b"){
 rect(x,y,w,h,color);
 ctx.strokeStyle=stroke;
 ctx.lineWidth=3;
 ctx.strokeRect(x,y,w,h);
}

function stars(){

 for(let i=0;i<100;i++){

  let sx=(i*83)%960;
  let sy=(i*47)%280;

  rect(
   sx,
   sy,
   2,
   2,
   i%3 ? "#f5e8a8" : "#fff"
  );

 }

}

/* =========================
   TITLE SCREEN
========================= */

function title(){

 let gradient=ctx.createLinearGradient(0,0,0,H);

 gradient.addColorStop(0,"#111c45");
 gradient.addColorStop(.55,"#7b4663");
 gradient.addColorStop(1,"#e59b52");

 ctx.fillStyle=gradient;
 ctx.fillRect(0,0,W,H);

 stars();

 /* mountains */

 ctx.fillStyle="#28375c";

 ctx.beginPath();
 ctx.moveTo(0,390);
 ctx.lineTo(160,245);
 ctx.lineTo(280,370);
 ctx.lineTo(430,215);
 ctx.lineTo(590,370);
 ctx.lineTo(760,230);
 ctx.lineTo(960,380);
 ctx.lineTo(960,540);
 ctx.lineTo(0,540);
 ctx.fill();

 /* forest */

 ctx.fillStyle="#162b31";

 ctx.beginPath();
 ctx.moveTo(0,450);
 ctx.lineTo(170,350);
 ctx.lineTo(300,430);
 ctx.lineTo(450,330);
 ctx.lineTo(600,430);
 ctx.lineTo(760,335);
 ctx.lineTo(960,425);
 ctx.lineTo(960,540);
 ctx.lineTo(0,540);
 ctx.fill();

 /* ground */

 rect(0,430,960,110,"#2d653b");

 for(let i=0;i<100;i++){

  rect(
   (i*97)%960,
   430+(i*29)%100,
   3,
   3,
   i%2 ? "#75a94e" : "#b8c76b"
  );

 }

 /* castle */

 drawCastle(640,310,1);

 /* hero looking away */

 drawHero(500,430,1.7,true);

 /* logo */

 panel(40,35,350,95,"#11182a","#e3c26b");

 text(
  "REALM OF",
  63,72,22,
  "#e9d18b"
 );

 text(
  "LEGENDS",
  63,105,35,
  "#fff4c7"
 );

 /* menu */

 panel(45,155,250,245,"#111827","#c9a85b");

 text("START",80,205,28,"#ffe58b");
 text("WERELDEN",80,250,22);
 text("INVENTORY",80,290,22);
 text("INSTELLINGEN",80,330,18);
 text("EXTRA'S",80,365,18);

 text(
  "Tik of druk ENTER",
  65,435,16,
  "#ffe58b"
 );

}

/* =========================
   CHARACTER SELECT
========================= */

function selectScreen(){

 rect(0,0,W,H,"#10192a");

 stars();

 text(
  "KIES JE HELD",
  310,55,30,
  "#ffe6a0"
 );

 for(let i=0;i<4;i++){

  let xx=35+i*230;

  panel(
   xx,90,205,290,
   i===selected ? "#263653" : "#151d2e",
   i===selected ? "#ffd45c" : "#57627a"
  );

  drawHero(
   xx+102,
   190,
   1.5,
   false,
   i
  );

  text(
   heroes[i].name,
   xx+45,
   330,
   20,
   i===selected ? "#ffe48a" : "#fff"
  );

  text(
   "HP "+heroes[i].hp+
   "  MP "+heroes[i].mp,
   xx+30,
   360,
   14,
   "#bcd4ff"
  );

 }

 panel(
  300,415,360,75,
  "#202d46","#e7bd55"
 );

 text(
  "START GAME",
  402,462,25,
  "#fff0a5"
 );

}

/* =========================
   WORLD
========================= */

function world(){

 rect(0,0,W,H,"#4b8f58");

 /* river */

 rect(0,250,960,80,"#2b7fa3");

 for(let i=0;i<960;i+=38){

  rect(
   i,
   270+(i%3)*8,
   24,
   3,
   "#75d0d1"
  );

 }

 /* grass */

 for(let i=0;i<180;i++){

  let xx=(i*67)%960;
  let yy=(i*41)%500;

  if(yy>245 && yy<340) continue;

  rect(
   xx,
   yy,
   3,
   3,
   i%3 ? "#356b3c" : "#a3bd5a"
  );

 }

 /* paths */

 rect(0,370,960,35,"#b38b55");
 rect(450,0,40,540,"#b38b55");

 /* bridge */

 rect(425,245,90,90,"#744d31");

 for(let yy=250;yy<335;yy+=15){

  rect(
   430,
   yy,
   80,
   7,
   "#c08b4f"
  );

 }

 /* trees */

 for(let i=0;i<35;i++){

  let tx=(i*137)%930;
  let ty=70+(i*83)%390;

  if(tx>410 && tx<530) continue;

  tree(tx,ty);

 }

 /* houses */

 house(120,120,"#c46c48");
 house(710,90,"#b85d4e");

 shop(790,405);

 /* castle */

 drawCastle(455,35,1);

 /* cave */

 rect(80,425,100,70,"#433d45");

 ctx.fillStyle="#171722";

 ctx.beginPath();
 ctx.arc(130,495,43,Math.PI,0);
 ctx.fill();

 /* player */

 drawHero(
  player.x,
  player.y,
  1,
  false
 );

 /* enemies */

 for(const enemy of enemies){

  if(enemy.hp>0){

   drawEnemy(
    enemy.x,
    enemy.y,
    enemy.type
   );

  }

 }

 HUD();

 prompt();

}

/* =========================
   TREES
========================= */

function tree(x,y){

 rect(
  x+17,y+30,
  14,38,
  "#70492c"
 );

 for(let q=0;q<5;q++){

  let ox=(q%3)*18-18;
  let oy=(q%2)*16-18;

  rect(
   x+ox+18,
   y+oy+25,
   35,35,
   "#245c35"
  );

  rect(
   x+ox+24,
   y+oy+18,
   24,18,
   "#367c43"
  );

  rect(
   x+ox+30,
   y+oy+12,
   12,12,
   "#5b9a4d"
  );

 }

}

/* =========================
   HOUSES
========================= */

function house(x,y,color){

 rect(
  x,y,
  130,85,
  "#76533b"
 );

 ctx.fillStyle=color;

 ctx.beginPath();

 ctx.moveTo(x-10,y);
 ctx.lineTo(x+65,y-45);
 ctx.lineTo(x+140,y);

 ctx.fill();

 rect(
  x+50,
  y+40,
  30,
  45,
  "#3b2a28"
 );

 rect(
  x+15,
  y+20,
  25,20,
  "#a9d5c9"
 );

}

/* =========================
   SHOP
========================= */

function shop(x,y){

 house(
  x,y,
  "#d29a48"
 );

 text(
  "SHOP",
  x+35,
  y+30,
  12,
  "#fff0a0"
 );

}

/* =========================
   CASTLE
========================= */

function drawCastle(x,y,s){

 rect(
  x+55,
  y+55,
  170*s,
  105*s,
  "#606675"
 );

 for(let i=0;i<3;i++){

  rect(
   x+i*65,
   y+20,
   48,
   140,
   "#717888"
  );

  rect(
   x+i*65+12,
   y+2,
   24,
   35,
   "#8c93a2"
  );

 }

 ctx.fillStyle="#9c3941";

 ctx.beginPath();

 ctx.moveTo(x+50,y+55);
 ctx.lineTo(x+140,y+10);
 ctx.lineTo(x+230,y+55);

 ctx.fill();

 rect(
  x+128,
  y+100,
  25,
  60,
  "#292631"
 );

}

/* =========================
   HERO
========================= */

function drawHero(x,y,s,back=false,type=selected){

 /* shadow */

 rect(
  x-18*s,
  y+24*s,
  36*s,
  8*s,
  "#17221b"
 );

 /* cape */

 rect(
  x-15*s,
  y-18*s,
  30*s,
  48*s,
  heroes[type].color
 );

 if(back){

  rect(
   x-12*s,
   y-45*s,
   24*s,
   28*s,
   "#6e4933"
  );

  rect(
   x-15*s,
   y-50*s,
   30*s,
   10*s,
   "#26364d"
  );

  rect(
   x-24*s,
   y+8*s,
   8*s,
   28*s,
   "#5d412f"
  );

 }else{

  rect(
   x-12*s,
   y-45*s,
   24*s,
   25*s,
   "#754b32"
  );

  rect(
   x-10*s,
   y-42*s,
   5*s,
   4*s,
   "#fff"
  );

  rect(
   x+5*s,
   y-42*s,
   5*s,
   4*s,
   "#fff"
  );

  rect(
   x-20*s,
   y-4*s,
   8*s,
   27*s,
   "#67482f"
  );

  rect(
   x+12*s,
   y-4*s,
   8*s,
   27*s,
   "#67482f"
  );

 }

 /* sword */

 ctx.save();

 ctx.translate(
  x+20*s,
  y
 );

 ctx.rotate(-.55);

 rect(
  0,
  -35*s,
  6*s,
  35*s,
  swords[equipped].color
 );

 rect(
  -3*s,
  0,
  12*s,
  5*s,
  "#8a633b"
 );

 ctx.restore();

}

/* =========================
   ENEMIES
========================= */

function drawEnemy(x,y,type){

 rect(
  x-20,
  y+18,
  40,7,
  "#17221b"
 );

 if(type==="slime"){

  rect(
   x-20,
   y-10,
   40,30,
   "#4fc46c"
  );

  rect(
   x-12,
   y-20,
   24,15,
   "#75e083"
  );

  rect(
   x-10,
   y-4,
   5,5,
   "#17221b"
  );

  rect(
   x+5,
   y-4,
   5,5,
   "#17221b"
  );

 }else{

  rect(
   x-25,
   y-10,
   50,28,
   "#6d4c63"
  );

  rect(
   x-18,
   y-25,
   36,20,
   "#855b75"
  );

  rect(
   x-10,
   y-20,
   5,5,
   "#ffdf63"
  );

  rect(
   x+5,
   y-20,
   5,5,
   "#ffdf63"
  );

 }

}

   HUD
========================= */

 panel(

 );

 );

 text(

  183,71,11
 );

 /* sword panel */

 panel(
  735,12,
  213,76,
  "#101722",
  "#c6a354"
 );

 text(
  swords[equipped].name,
  748,36,16,

 );

 text(

  748,58,14,
  swords[equipped].color
 );

/* =========================
   INVENTORY
========================= */

 rect(

 );

 text(

  40,48,30,
  "#ffe29a"
 );

 panel(

  "#131c2b",

 );

 );

 text(

  "RARITY: "+sword.rarity,

 panel(

/* =========================
   COMBAT
========================= */

function attack(){

 if(screen!=="game")return;

 for(const enemy of enemies){

  if(
   enemy.hp>0 &&
   Math.hypot(
    enemy.x-player.x,
    enemy.y-player.y
   )<95
  ){

   enemy.hp=Math.max(
    0,
    enemy.hp-swords[equipped].damage
   );

   toast(
    swords[equipped].name+
    " • "+
    swords[equipped].ability
   );

  }

 }

}

function ability(){

 if(player.mp<12){

  toast("Niet genoeg MP!");
  return;

 }

 player.mp-=12;

 for(const enemy of enemies){

  if(
   enemy.hp>0 &&
   Math.hypot(
    enemy.x-player.x,
    enemy.y-player.y
   )<150
  ){

   enemy.hp=Math.max(
    0,
    enemy.hp-swords[equipped].damage*2
   );

  }

 }

 toast(
  "✦ "+
  swords[equipped].ability
 );

}

/* =========================
   INTERACT
========================= */

function interact(){

 if(
  Math.hypot(
   player.x-145,
   player.y-450
  )<100
 ){

  room="cave";

  toast(
   "Je gaat de grot binnen!"
  );

 }

 else if(
  player.x>90 &&
  player.x<260 &&
  player.y<230
 ){

  room="house";

  toast(
   "Huis binnengaan..."
  );

 }

 else if(
  player.x>680 &&
  player.x<850 &&
  player.y<210
 ){

  room="shop";

  toast(
   "Winkel binnengaan..."
  );

 }

 else if(
  player.x>430 &&
  player.x<700 &&
  player.y<190
 ){

  room="castle";

  toast(
   "Kasteel binnengaan..."
  );

 }

}

/* =========================
   START
========================= */

function startGame(){

 screen="game";

 player.hp=heroes[selected].hp;
 player.mp=heroes[selected].mp;

 player.x=470;
 player.y=320;

}

/* =========================
   INTERIORS
========================= */

function interior(){

 rect(
  0,0,W,H,
  "#7c624b"
 );

 rect(
  45,45,870,450,
  "#b99a6d"
 );

 for(let i=0;i<8;i++){

  rect(
   65+i*105,
   65,
   85,410,
   "#8c684d"
  );

 rect(
  360,400,
  240,95,
  "#5b3b2d"
 );

 text(
  room==="shop" ? "WINKEL" :
  room==="castle" ? "KASTEELZAAL" :

  "#fff0b0"
 );

 rect(

  80,45,
  "#3b2a27"
 );

 text(
  "E",
  470,478,18
 );

 text(
  "Ga naar de deur om terug te gaan",

  "#fff2bd"
 );

 drawHero(

  350,

 );

}

/* =========================
   PROMPT
========================= */

function prompt(){

 text(
  "E: onderzoek / ga naar binnen",
  350,520,14,
  "#fff2bd"
 );

}

/* =========================
   MESSAGE
========================= */

function toast(t){

 message=t;
 msgTime=120;

}

/* =========================
   MAIN LOOP
========================= */

function loop(){

 if(screen==="title")
  title();

 else if(screen==="select")
  selectScreen();

 else if(screen==="inventory")
  inventory();

 else if(screen==="game"){

  if(room==="island")
   world();
  else
   interior();

 }

 if(msgTime>0){

  panel(
   300,465,
   360,42,
   "#101722",
   "#d5ae55"
  );

  text(
   message,
   320,492,14,
   "#ffe9a8"
  );

  msgTime--;

 }

 requestAnimationFrame(loop);

}

/* =========================
   MOVEMENT
========================= */

function move(){

 if(
  screen!=="game" ||
  room!=="island"
 )
  return;

 let speed=2.8;

 let dx=0;
 let dy=0;

 if(keys.w||keys.ArrowUp)
  dy=-1;

 if(keys.s||keys.ArrowDown)
  dy=1;

 if(keys.a||keys.ArrowLeft)
  dx=-1;

 if(keys.d||keys.ArrowRight)
  dx=1;

 if(dx&&dy){

  dx*=.707;
  dy*=.707;

 }

 player.x=Math.max(
  25,
  Math.min(
   935,
   player.x+dx*speed
  )
 );

 player.y=Math.max(
  35,
  Math.min(
   500,
   player.y+dy*speed
  )
}

/* =========================
   KEYBOARD
========================= */

addEventListener(
 "keydown",
 e=>{

  keys[e.key]=true;

  if(
   e.key==="Enter" &&
   screen==="title"
  ){

   screen="select";

  }

  else if(
   e.key==="Enter" &&
   screen==="select"
  ){

   startGame();

  }

  else if(
   e.key==="i" ||
   e.key==="I"
  ){

   if(screen==="game")
    screen="inventory";

   else if(screen==="inventory")
    screen="game";

  }

  else if(e.key==="1")
   attack();

  else if(e.key==="2")
   ability();

  else if(
   e.key==="e" ||
   e.key==="E"
  ){

   if(screen==="game")
    interact();

  }

 });

addEventListener(
 "keyup",
 e=>{
  keys[e.key]=false;
 }
);

/* =========================
   TOUCH / MOUSE
========================= */

canvas.addEventListener(
 "pointerdown",
 e=>{

  const r=canvas.getBoundingClientRect();

  const mx=
   (e.clientX-r.left)/
   r.width*W;

  const my=
   (e.clientY-r.top)/
   r.height*H;

  /* TITLE */

  if(screen==="title"){

   screen="select";

  }

  /* SELECT */

  else if(screen==="select"){

   for(let i=0;i<4;i++){

    let xx=35+i*230;

    if(
     mx>=xx &&
     mx<=xx+205 &&
     my>=90 &&
     my<=380
    ){

     selected=i;

     player.hp=heroes[i].hp;
     player.mp=heroes[i].mp;

     return;

    }

   }

   if(
    mx>=300 &&
    mx<=660 &&
    my>=405
   ){

    startGame();

   }

  }

  /* GAME */

  else if(screen==="game"){

   if(
    mx>800 &&
    my>400
   ){

    attack();

   }

   else if(
    mx>700 &&
    my>440
   ){

    screen="inventory";

   }

  }

  /* INVENTORY */

  else if(screen==="inventory"){

   for(
    let i=0;
    i<owned.length;
    i++
   ){

    let y=125+i*52;

    if(
     my>=y &&
     my<=y+43 &&
     mx>=55 &&
     mx<=575
    ){

     equipped=owned[i];

     toast(
      "Geëquipeerd: "+
      swords[equipped].name
     );

    }

   }

   if(my>420)
    screen="game";

  }

 });

/* =========================
   ENEMY / SWORD DROPS
========================= */

setInterval(()=>{

 if(
  screen==="game" &&
  enemies.every(e=>e.hp<=0)
 ){

  enemies=[
   {
    x:650,
    y:260,
    hp:50,
    max:50,
    type:"slime"
   },
   {
    x:760,
    y:350,
    hp:70,
    max:70,
    type:"wolf"
   },
   {
    x:350,
    y:180,
    hp:45,
    max:45,
    type:"slime"
   }
  ];

  let next=Math.min(
   swords.length-1,
   owned.length
  );

  if(!owned.includes(next)){

   owned.push(next);

   toast(
    "Nieuwe sword gevonden: "+
    swords[next].name+
    " ["+
    swords[next].rarity+
    "]"
   );

  }

 }

},1000);

/* =========================
   START
========================= */

setInterval(move,16);

loop();

</script>
