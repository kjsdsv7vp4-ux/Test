<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Realm of Legends</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080914;
    font-family:monospace;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;
}

canvas{
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    width:100vw;
    height:100vh;
    object-fit:contain;
    background:#101522;
}

button{
    font-family:monospace;
}
</style>
</head>

<body>

<canvas id="game" width="480" height="270"></canvas>

<script>
"use strict";

/* =========================================================
   REALM OF LEGENDS
   16-BIT JRPG PIXEL STYLE
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

ctx.imageSmoothingEnabled = false;

const W = canvas.width;
const H = canvas.height;

let screen = "title";
let selectedCharacter = 0;
let gameStarted = false;

let keys = {};

let player = {
    x: 240,
    y: 190,
    speed: 1.55,
    dir: 0,
    frame: 0
};

const characters = [
    {
        name:"WARRIOR",
        color:"#4e7cff",
        hair:"#542d23",
        armor:"#4269a9",
        weapon:"#d9dce5",
        desc:"Sterke krijger met een zwaar zwaard."
    },
    {
        name:"MAGE",
        color:"#a65cff",
        hair:"#211833",
        armor:"#633da0",
        weapon:"#7be8ff",
        desc:"Meester van krachtige magie."
    },
    {
        name:"ARCHER",
        color:"#51c66b",
        hair:"#633b27",
        armor:"#39784b",
        weapon:"#c69b58",
        desc:"Snelle boogschutter uit het bos."
    },
    {
        name:"KNIGHT",
        color:"#d8b34d",
        hair:"#493a32",
        armor:"#78818f",
        weapon:"#e7eaf0",
        desc:"Ridder met zware verdediging."
    }
];

/* =========================================================
   INPUT
   ========================================================= */

window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;

    if(screen==="title"){
        if(e.key==="Enter" || e.key===" "){
            screen="select";
        }
    }
    else if(screen==="select"){
        if(e.key==="ArrowLeft" || e.key.toLowerCase()==="a"){
            selectedCharacter--;
            if(selectedCharacter<0) selectedCharacter=characters.length-1;
        }

        if(e.key==="ArrowRight" || e.key.toLowerCase()==="d"){
            selectedCharacter++;
            if(selectedCharacter>=characters.length) selectedCharacter=0;
        }

        if(e.key==="Enter" || e.key===" "){
            startGame();
        }
    }
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

canvas.addEventListener("click",e=>{
    if(screen==="title"){
        screen="select";
    }
});

/* =========================================================
   COLORS
   ========================================================= */

const C = {
    black:"#090b16",
    dark:"#151a2b",
    deep:"#22263d",
    sky1:"#f29b78",
    sky2:"#c85f70",
    sky3:"#6e4b72",
    mountain:"#26263b",
    mountain2:"#35344e",
    forestDark:"#102b27",
    forest:"#174436",
    forestLight:"#286248",
    grass:"#3c7950",
    grass2:"#57975a",
    water:"#245a7b",
    waterLight:"#397e9d",
    sand:"#d6b878",
    stone:"#737889",
    stoneDark:"#45495b",
    gold:"#f1cb63",
    white:"#fff2cf",
    red:"#c94747"
};

/* =========================================================
   UTILS
   ========================================================= */

function rect(x,y,w,h,c){
    ctx.fillStyle=c;
    ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));
}

function px(x,y,c){
    rect(x,y,1,1,c);
}

function text(str,x,y,size=8,color=C.white,align="left"){
    ctx.font=`bold ${size}px monospace`;
    ctx.textAlign=align;
    ctx.textBaseline="middle";
    ctx.fillStyle=color;
    ctx.fillText(str,x,y);
}

function shadowText(str,x,y,size=8,color=C.white,align="left"){
    text(str,x+1,y+1,size,C.black,align);
    text(str,x,y,size,color,align);
}

function clamp(v,a,b){
    return Math.max(a,Math.min(b,v));
}

/* =========================================================
   PIXEL CLOUDS
   ========================================================= */

function cloud(x,y,s=1){
    rect(x,y,24*s,4*s,"#f6c5ae");
    rect(x+5*s,y-3*s,13*s,4*s,"#f6c5ae");
    rect(x+11*s,y-5*s,8*s,3*s,"#f6c5ae");
}

/* =========================================================
   TREE
   ========================================================= */

function tree(x,y,s=1){
    // shadow
    rect(x-7*s,y+19*s,18*s,4*s,"#0d241f");

    // trunk
    rect(x,y+9*s,5*s,14*s,"#533627");
    rect(x+4*s,y+11*s,3*s,12*s,"#39271f");

    // dark foliage
    rect(x-8*s,y-2*s,20*s,15*s,C.forestDark);
    rect(x-5*s,y-7*s,14*s,9*s,C.forestDark);
    rect(x-11*s,y+2*s,9*s,8*s,C.forestDark);

    // main foliage
    rect(x-5*s,y-4*s,14*s,12*s,C.forest);
    rect(x-9*s,y+1*s,7*s,7*s,C.forest);
    rect(x+6*s,y+2*s,7*s,7*s,C.forest);

    // highlights
    rect(x-3*s,y-3*s,5*s,3*s,C.forestLight);
    rect(x-7*s,y+2*s,4*s,3*s,C.forestLight);
    rect(x+3*s,y+1*s,4*s,4*s,C.forestLight);
}

/* =========================================================
   MOUNTAIN
   ========================================================= */

function mountain(x,y,w,h){
    ctx.fillStyle=C.mountain;
    ctx.beginPath();
    ctx.moveTo(x,y+h);
    ctx.lineTo(x+w*0.48,y);
    ctx.lineTo(x+w,y+h);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle=C.mountain2;
    ctx.beginPath();
    ctx.moveTo(x+w*0.48,y);
    ctx.lineTo(x+w*0.29,y+h*0.4);
    ctx.lineTo(x+w*0.42,y+h*0.35);
    ctx.lineTo(x+w*0.55,y+h*0.58);
    ctx.lineTo(x+w*0.69,y+h*0.38);
    ctx.lineTo(x+w,y+h);
    ctx.lineTo(x,y+h);
    ctx.closePath();
    ctx.fill();
}

/* =========================================================
   CASTLE
   ========================================================= */

function castle(x,y,s=1){
    // giant shadow
    rect(x-34*s,y+48*s,76*s,6*s,"#25243a");

    // main castle
    rect(x-29*s,y+4*s,58*s,45*s,"#77798a");
    rect(x-23*s,y-7*s,13*s,56*s,"#858796");
    rect(x+10*s,y-12*s,15*s,61*s,"#8b8d9b");

    // towers
    rect(x-34*s,y-13*s,15*s,62*s,"#656877");
    rect(x+23*s,y-18*s,15*s,67*s,"#666a79");

    // roofs
    ctx.fillStyle="#343649";

    ctx.beginPath();
    ctx.moveTo(x-37*s,y-13*s);
    ctx.lineTo(x-26*s,y-25*s);
    ctx.lineTo(x-16*s,y-13*s);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x+20*s,y-18*s);
    ctx.lineTo(x+30*s,y-31*s);
    ctx.lineTo(x+41*s,y-18*s);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(x+7*s,y-12*s);
    ctx.lineTo(x+17*s,y-25*s);
    ctx.lineTo(x+28*s,y-12*s);
    ctx.closePath();
    ctx.fill();

    // windows
    rect(x-30*s,y+1*s,4*s,8*s,C.gold);
    rect(x+28*s,y-4*s,4*s,8*s,C.gold);
    rect(x+14*s,y-1*s,4*s,8*s,C.gold);

    // gate
    rect(x-7*s,y+29*s,14*s,20*s,"#282837");
    rect(x-4*s,y+32*s,8*s,17*s,"#151722");

    // flag
    rect(x+17*s,y-38*s,2*s,18*s,C.gold);
    rect(x+19*s,y-37*s,11*s,6*s,C.red);
}

/* =========================================================
   WEAPON ON GROUND
   ========================================================= */

function groundSword(x,y,s=1){
    // shadow
    rect(x-2*s,y+4*s,28*s,3*s,"#181728");

    // blade
    rect(x+3*s,y-2*s,21*s,3*s,"#d9e1ea");
    rect(x+7*s,y-5*s,17*s,2*s,"#f4f5f8");
    rect(x+23*s,y-2*s,4*s,2*s,"#b8c2cc");

    // guard
    rect(x+1*s,y-4*s,3*s,9*s,C.gold);
    rect(x-2*s,y-1*s,7*s,3*s,C.gold);

    // handle
    rect(x-8*s,y-1*s,8*s,3*s,"#70462c");
    rect(x-10*s,y-2*s,3*s,5*s,"#3b2922");
}

/* =========================================================
   CHARACTER BACK SPRITE
   ========================================================= */

function heroBack(x,y,type=0,scale=1,anim=0){
    const ch=characters[type];

    // shadow
    rect(x-8*scale,y+17*scale,16*scale,4*scale,"#191827");

    // cape/back
    if(type===1){
        rect(x-7*scale,y-2*scale,14*scale,18*scale,ch.armor);
        rect(x-5*scale,y+1*scale,10*scale,12*scale,"#3d246c");
    }else{
        rect(x-7*scale,y-1*scale,14*scale,16*scale,ch.armor);
    }

    // legs
    rect(x-6*scale,y+13*scale,5*scale,7*scale,"#292b39");
    rect(x+2*scale,y+13*scale,5*scale,7*scale,"#292b39");

    if(anim%2===1){
        rect(x-7*scale,y+18*scale,6*scale,3*scale,"#171821");
        rect(x+2*scale,y+17*scale,6*scale,3*scale,"#171821");
    }

    // shoulders
    rect(x-10*scale,y+1*scale,4*scale,8*scale,ch.armor);
    rect(x+6*scale,y+1*scale,4*scale,8*scale,ch.armor);

    // neck
    rect(x-3*scale,y-5*scale,6*scale,5*scale,"#d49b72");

    // hair
    rect(x-7*scale,y-12*scale,14*scale,10*scale,ch.hair);
    rect(x-5*scale,y-15*scale,10*scale,4*scale,ch.hair);
    rect(x-9*scale,y-8*scale,3*scale,6*scale,ch.hair);
    rect(x+6*scale,y-8*scale,3*scale,6*scale,ch.hair);

    // armor details
    rect(x-4*scale,y+2*scale,2*scale,7*scale,ch.color);
    rect(x+2*scale,y+2*scale,2*scale,7*scale,ch.color);

    // weapon depending class
    if(type===0 || type===3){
        rect(x+9*scale,y+3*scale,2*scale,15*scale,ch.weapon);
        rect(x+7*scale,y+3*scale,6*scale,2*scale,C.gold);
    }

    if(type===1){
        rect(x+9*scale,y-1*scale,2*scale,12*scale,ch.weapon);
        rect(x+7*scale,y+7*scale,7*scale,2*scale,ch.weapon);
    }

    if(type===2){
        // bow
        ctx.strokeStyle=ch.weapon;
        ctx.lineWidth=Math.max(1,scale);
        ctx.beginPath();
        ctx.arc(x+9*scale,y+6*scale,7*scale,-1.3,1.3);
        ctx.stroke();
    }
}

/* =========================================================
   START SCENE
   ========================================================= */

function drawStartScene(){

    // sky gradient
    const grad=ctx.createLinearGradient(0,0,0,190);
    grad.addColorStop(0,"#403c72");
    grad.addColorStop(.35,"#8d5575");
    grad.addColorStop(.7,"#d76d70");
    grad.addColorStop(1,"#f1a06f");

    ctx.fillStyle=grad;
    ctx.fillRect(0,0,W,H);

    // moon/sun
    ctx.fillStyle="#ffd78b";
    ctx.beginPath();
    ctx.arc(385,55,24,0,Math.PI*2);
    ctx.fill();

    // clouds
    cloud(40,39,1);
    cloud(115,68,1);
    cloud(300,30,1);
    cloud(405,92,1);

    // distant mountains
    mountain(-40,108,180,90);
    mountain(80,98,190,100);
    mountain(220,105,200,95);
    mountain(350,96,180,100);

    // distant island
    rect(0,166,480,104,C.grass);

    // water strips
    rect(0,157,480,9,C.water);
    rect(0,162,480,5,C.waterLight);

    // distant forest
    for(let x=-10;x<490;x+=13){
        let yy=148+Math.sin(x*.12)*7;
        tree(x,yy,.72);
    }

    // castle
    castle(330,111,1.15);

    // castle path
    ctx.fillStyle="#a18b67";
    ctx.beginPath();
    ctx.moveTo(313,164);
    ctx.lineTo(346,164);
    ctx.lineTo(245,225);
    ctx.lineTo(215,225);
    ctx.closePath();
    ctx.fill();

    // forests foreground
    for(let x=0;x<210;x+=16){
        tree(x,178+Math.sin(x)*3,.95);
    }

    for(let x=360;x<490;x+=16){
        tree(x,177+Math.sin(x)*3,.95);
    }

    // foreground mountain ledge
    ctx.fillStyle="#242438";
    ctx.beginPath();
    ctx.moveTo(0,220);
    ctx.lineTo(70,205);
    ctx.lineTo(125,215);
    ctx.lineTo(178,199);
    ctx.lineTo(235,215);
    ctx.lineTo(300,203);
    ctx.lineTo(360,217);
    ctx.lineTo(420,207);
    ctx.lineTo(480,218);
    ctx.lineTo(480,270);
    ctx.lineTo(0,270);
    ctx.closePath();
    ctx.fill();

    // mountain grass pixels
    for(let x=0;x<480;x+=9){
        let y=214+Math.sin(x*.09)*5;
        rect(x,y,4,2,C.forestLight);
    }

    // hero
    const heroX=238;
    const heroY=210;

    heroBack(
        heroX,
        heroY,
        selectedCharacter,
        2.0,
        Math.floor(performance.now()/400)
    );

    // sword
    groundSword(255,232,1.35);

    // title
    shadowText(
        "REALM OF LEGENDS",
        W/2,
        24,
        18,
        C.gold,
        "center"
    );

    shadowText(
        "THE LOST ISLAND",
        W/2,
        43,
        7,
        C.white,
        "center"
    );

    // start box
    rect(164,245,152,20,"#121524");
    rect(166,247,148,16,"#242a42");

    shadowText(
        "▶  START",
        W/2,
        255,
        10,
        C.gold,
        "center"
    );

    text(
        "ENTER / TAP",
        W/2,
        267,
        5,
        "#d8d5c7",
        "center"
    );
}

/* =========================================================
   CHARACTER SELECTION
   ========================================================= */

function drawSelection(){

    // background
    ctx.fillStyle="#101628";
    ctx.fillRect(0,0,W,H);

    // pixel background
    for(let y=0;y<H;y+=6){
        rect(0,y,W,1,"#151d32");
    }

    shadowText(
        "CHOOSE YOUR HERO",
        W/2,
        25,
        16,
        C.gold,
        "center"
    );

    text(
        "←  A   D  →",
        W/2,
        43,
        7,
        "#aaaec3",
        "center"
    );

    // cards
    for(let i=0;i<characters.length;i++){

        const x=60+i*120;
        const active=i===selectedCharacter;

        rect(
            x-39,
            62,
            78,
            135,
            active ? "#343b61" : "#1d2338"
        );

        rect(
            x-36,
            65,
            72,
            129,
            active ? "#252c4b" : "#171d30"
        );

        if(active){
            rect(x-32,68,64,3,C.gold);
            rect(x-32,191,64,3,C.gold);
        }

        // character
        heroBack(
            x,
            135,
            i,
            3,
            Math.floor(performance.now()/350)
        );

        shadowText(
            characters[i].name,
            x,
            176,
            8,
            active ? C.gold : C.white,
            "center"
        );
    }

    // description
    rect(92,207,296,28,"#161b2d");
    text(
        characters[selectedCharacter].desc,
        W/2,
        219,
        6,
        "#d9d8cf",
        "center"
    );

    shadowText(
        "ENTER / TAP TO SELECT",
        W/2,
        250,
        8,
        C.gold,
        "center"
    );

    text(
        "SELECTED: "+characters[selectedCharacter].name,
        W/2,
        263,
        5,
        "#aaaec3",
        "center"
    );
}

/* =========================================================
   WORLD
   ========================================================= */

const worldTrees=[];

function generateWorld(){

    worldTrees.length=0;

    for(let i=0;i<180;i++){

        const x=Math.random()*900;
        const y=Math.random()*650;

        // keep central village open
        if(x>300&&x<620&&y>220&&y<430) continue;

        worldTrees.push({
            x,
            y,
            s:.7+Math.random()*.7
        });
    }
}

generateWorld();

/* =========================================================
   WORLD MAP
   ========================================================= */

function drawWorld(){

    ctx.fillStyle=C.water;
    ctx.fillRect(0,0,W,H);

    const camX=player.x-W/2;
    const camY=player.y-H/2;

    // island
    ctx.save();
    ctx.translate(-camX,-camY);

    // island base
    ctx.fillStyle=C.grass;
    ctx.beginPath();
    ctx.ellipse(450,330,430,300,0,0,Math.PI*2);
    ctx.fill();

    // beach
    ctx.strokeStyle=C.sand;
    ctx.lineWidth=16;
    ctx.beginPath();
    ctx.ellipse(450,330,405,275,0,0,Math.PI*2);
    ctx.stroke();

    // mountains
    mountain(50,60,250,230);
    mountain(620,40,250,260);
    mountain(340,20,250,240);

    // rivers
    ctx.strokeStyle=C.water;
    ctx.lineWidth=14;

    ctx.beginPath();
    ctx.moveTo(460,0);
    ctx.bezierCurveTo(430,120,500,190,430,300);
    ctx.bezierCurveTo(370,400,420,500,350,650);
    ctx.stroke();

    ctx.strokeStyle=C.waterLight;
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.moveTo(460,0);
    ctx.bezierCurveTo(430,120,500,190,430,300);
    ctx.bezierCurveTo(370,400,420,500,350,650);
    ctx.stroke();

    // castle
    castle(450,225,1.8);

    // village houses
    drawHouse(270,360);
    drawHouse(330,390);
    drawHouse(570,350);
    drawHouse(620,395);

    // trees
    for(const t of worldTrees){
        if(
            t.x>player.x-500 &&
            t.x<player.x+500 &&
            t.y>player.y-400 &&
            t.y<player.y+400
        ){
            tree(t.x,t.y,t.s);
        }
    }

    // cave
    drawCave(170,150);
    drawCave(760,470);

    // bridge
    drawBridge(425,285);

    // player
    heroBack(
        player.x,
        player.y,
        selectedCharacter,
        1.25,
        Math.floor(player.frame)
    );

    ctx.restore();

    drawHUD();
}

/* =========================================================
   HOUSE
   ========================================================= */

function drawHouse(x,y){

    rect(x,y,50,35,"#9d6247");
    rect(x+4,y+6,42,29,"#b77453");

    ctx.fillStyle="#673e35";
    ctx.beginPath();
    ctx.moveTo(x-5,y+7);
    ctx.lineTo(x+25,y-15);
    ctx.lineTo(x+55,y+7);
    ctx.closePath();
    ctx.fill();

    rect(x+20,y+20,10,15,"#33262c");
    rect(x+7,y+13,8,7,"#f0c96d");
    rect(x+35,y+13,8,7,"#f0c96d");
}

/* =========================================================
   CAVE
   ========================================================= */

function drawCave(x,y){

    ctx.fillStyle="#303243";
    ctx.beginPath();
    ctx.arc(x,y,24,Math.PI,Math.PI*2);
    ctx.lineTo(x+24,y+25);
    ctx.lineTo(x-24,y+25);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#10121d";
    ctx.beginPath();
    ctx.arc(x,y+3,14,Math.PI,Math.PI*2);
    ctx.lineTo(x+14,y+25);
    ctx.lineTo(x-14,y+25);
    ctx.closePath();
    ctx.fill();

    text("CAVE",x,y+34,5,C.white,"center");
}

/* =========================================================
   BRIDGE
   ========================================================= */

function drawBridge(x,y){

    for(let i=-2;i<=2;i++){
        rect(x+i*10,y-8,8,24,"#754b32");
    }

    rect(x-28,y-12,56,4,"#4c3528");
    rect(x-28,y+13,56,4,"#4c3528");
}

/* =========================================================
   HUD
   ========================================================= */

function drawHUD(){

    rect(8,8,130,32,"#101322");
    rect(11,11,124,26,"#242a40");

    text(
        characters[selectedCharacter].name,
        17,
        17,
        7,
        C.gold
    );

    rect(17,24,80,6,"#432b35");
    rect(17,24,63,6,C.red);

    text("HP",103,27,5,C.white);

    rect(W-150,8,142,38,"#101322");
    rect(W-147,11,136,32,"#242a40");

    text(
        "THE LOST ISLAND",
        W-79,
        19,
        7,
        C.white,
        "center"
    );

    text(
        "WASD / ARROWS",
        W-79,
        33,
        5,
        "#bfc3d2",
        "center"
    );
}

/* =========================================================
   MOVEMENT
   ========================================================= */

function updateGame(){

    let dx=0;
    let dy=0;

    if(keys["w"] || keys["arrowup"]) dy-=1;
    if(keys["s"] || keys["arrowdown"]) dy+=1;
    if(keys["a"] || keys["arrowleft"]) dx-=1;
    if(keys["d"] || keys["arrowright"]) dx+=1;

    if(dx!==0 || dy!==0){

        const length=Math.hypot(dx,dy);

        dx/=length;
        dy/=length;

        player.x+=dx*player.speed;
        player.y+=dy*player.speed;

        player.x=clamp(player.x,50,850);
        player.y=clamp(player.y,40,620);

        player.frame+=0.18;
    }
}

/* =========================================================
   MOBILE CONTROLS
   ========================================================= */

const touchButtons=[];

function createTouchControls(){

    if(document.getElementById("touchControls")) return;

    const div=document.createElement("div");
    div.id="touchControls";

    div.style.position="fixed";
    div.style.left="0";
    div.style.bottom="15px";
    div.style.width="100%";
    div.style.height="130px";
    div.style.pointerEvents="none";

    const make=(txt,left,bottom,key)=>{

        const b=document.createElement("button");

        b.innerText=txt;

        b.style.position="absolute";
        b.style.left=left;
        b.style.bottom=bottom;
        b.style.width="52px";
        b.style.height="42px";
        b.style.background="#171b2d";
        b.style.border="2px solid #777e9e";
        b.style.color="#fff";
        b.style.fontSize="18px";
        b.style.pointerEvents="auto";
        b.style.opacity=".8";

        b.addEventListener("touchstart",e=>{
            e.preventDefault();
            keys[key]=true;
        });

        b.addEventListener("touchend",e=>{
            e.preventDefault();
            keys[key]=false;
        });

        div.appendChild(b);
    };

    make("▲","70px","78px","w");
    make("◀","15px","36px","a");
    make("▼","70px","36px","s");
    make("▶","125px","36px","d");

    document.body.appendChild(div);
}

createTouchControls();

/* =========================================================
   START GAME
   ========================================================= */

function startGame(){

    screen="game";
    gameStarted=true;

    player.x=450;
    player.y=330;
}

/* =========================================================
   LOOP
   ========================================================= */

function loop(){

    if(screen==="title"){
        drawStartScene();
    }

    if(screen==="select"){
        drawSelection();
    }

    if(screen==="game"){
        updateGame();
        drawWorld();
    }

    requestAnimationFrame(loop);
}

loop();

/* =========================================================
   TOUCH START BUTTON
   ========================================================= */

canvas.addEventListener("touchstart",e=>{

    if(screen==="title"){
        screen="select";
        return;
    }

    if(screen==="select"){

        const touch=e.touches[0];

        if(touch.clientX<window.innerWidth/2){
            selectedCharacter--;
            if(selectedCharacter<0)
                selectedCharacter=characters.length-1;
        }else{
            selectedCharacter++;
            if(selectedCharacter>=characters.length)
                selectedCharacter=0;
        }

        if(e.touches.length>1){
            startGame();
        }
    }

},{passive:false});

canvas.addEventListener("dblclick",()=>{
    if(screen==="select"){
        startGame();
    }
});

</script>
