<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Realm of Legends 3D</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#08111d;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
}

#menu{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 30%,#263f62 0%,#0b1728 45%,#03070d 100%);
    color:white;
}

.panel{
    width:min(90%,520px);
    padding:35px;
    border:2px solid #6fa8dc;
    border-radius:25px;
    background:rgba(5,12,24,.92);
    box-shadow:0 0 50px rgba(50,150,255,.25);
    text-align:center;
}

.title{
    font-size:42px;
    font-weight:900;
    color:#7ed6ff;
    text-shadow:0 0 20px #168cff;
    margin-bottom:8px;
}

.subtitle{
    color:#b9cbe0;
    margin-bottom:25px;
}

.row{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin:15px 0;
}

.color{
    width:42px;
    height:42px;
    border-radius:50%;
    border:3px solid white;
    cursor:pointer;
}

#start{
    width:100%;
    padding:17px;
    margin-top:20px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#1597ff,#6c42ff);
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

#hud{
    position:fixed;
    z-index:5;
    top:15px;
    left:15px;
    color:white;
    pointer-events:none;
    display:none;
}

.box{
    background:rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.2);
    border-radius:12px;
    padding:10px 14px;
    margin-bottom:8px;
    backdrop-filter:blur(5px);
}

.bar{
    width:220px;
    height:15px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
    margin-top:5px;
}

#hp{
    height:100%;
    width:100%;
    background:linear-gradient(90deg,#18d45a,#9cff50);
}

#controls{
    position:fixed;
    z-index:6;
    bottom:20px;
    left:20px;
    display:none;
}

#joystick{
    width:125px;
    height:125px;
    border-radius:50%;
    background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.25);
    position:relative;
    touch-action:none;
}

#stick{
    width:55px;
    height:55px;
    position:absolute;
    left:35px;
    top:35px;
    border-radius:50%;
    background:rgba(120,200,255,.75);
}

#buttons{
    position:fixed;
    z-index:6;
    right:20px;
    bottom:20px;
    display:none;
    gap:12px;
}

.gameBtn{
    width:65px;
    height:65px;
    border-radius:50%;
    border:2px solid rgba(255,255,255,.35);
    background:rgba(20,40,70,.8);
    color:white;
    font-weight:bold;
    font-size:12px;
}

#attack{
    width:80px;
    height:80px;
    background:linear-gradient(135deg,#ff7a18,#ff2020);
}

#message{
    position:fixed;
    z-index:8;
    left:50%;
    top:25%;
    transform:translateX(-50%);
    color:white;
    font-size:25px;
    font-weight:bold;
    text-shadow:0 2px 8px black;
    opacity:0;
    transition:.25s;
    pointer-events:none;
}

@media(max-width:700px){
    .title{font-size:30px}
    .panel{padding:25px}
    .bar{width:170px}
}

@media(pointer:coarse){
    #controls,#buttons{
        display:flex;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
    <div class="panel">
        <div class="title">REALM OF LEGENDS</div>
        <div class="subtitle">3D Fantasy Adventure</div>

        <h3>Kies je kleur</h3>

        <div class="row">
            <div class="color" data-color="#2878ff" style="background:#2878ff"></div>
            <div class="color" data-color="#e83e3e" style="background:#e83e3e"></div>
            <div class="color" data-color="#35c96f" style="background:#35c96f"></div>
            <div class="color" data-color="#a44cff" style="background:#a44cff"></div>
            <div class="color" data-color="#ffb52e" style="background:#ffb52e"></div>
        </div>

        <p style="margin-top:20px;color:#aab8ca">
            WASD = bewegen<br>
            Muis slepen = camera draaien<br>
            Scroll = in/uitzoomen<br>
            Spatie = aanvallen<br>
            Q = dash
        </p>

        <button id="start">START GAME</button>
    </div>
</div>

<div id="hud">
    <div class="box">
        <b>⚔️ Realm of Legends</b>
        <div>Level 1</div>
    </div>

    <div class="box">
        HP
        <div class="bar">
            <div id="hp"></div>
        </div>
    </div>
</div>

<div id="message">⚔️ ATTACK!</div>

<div id="controls">
    <div id="joystick">
        <div id="stick"></div>
    </div>
</div>

<div id="buttons">
    <button class="gameBtn" id="dash">DASH</button>
    <button class="gameBtn" id="attack">ATTACK</button>
</div>

<script>
"use strict";

/* =========================================================
   BASIC SETUP
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = 0;
let H = 0;

function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize",resize);
resize();

/* =========================================================
   GAME STATE
========================================================= */

let playing = false;

const player = {
    x:0,
    z:0,
    y:0,
    angle:0,
    color:"#2878ff",
    hp:100,
    attackTimer:0,
    dashTimer:0
};

const camera = {
    yaw:0,
    pitch:.35,
    distance:8,
    targetYaw:0,
    targetPitch:.35,
    targetDistance:8
};

const keys = {};

window.addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()] = true;

    if(e.code === "Space"){
        e.preventDefault();
        attack();
    }

    if(e.key.toLowerCase()==="q"){
        dash();
    }
});

window.addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()] = false;
});

/* =========================================================
   MENU
========================================================= */

document.querySelectorAll(".color").forEach(el=>{
    el.addEventListener("click",()=>{
        player.color = el.dataset.color;

        document.querySelectorAll(".color").forEach(x=>{
            x.style.transform="scale(1)";
        });

        el.style.transform="scale(1.2)";
    });
});

document.getElementById("start").onclick=()=>{
    playing=true;

    document.getElementById("menu").style.display="none";
    document.getElementById("hud").style.display="block";

    if(matchMedia("(pointer:coarse)").matches){
        document.getElementById("controls").style.display="flex";
        document.getElementById("buttons").style.display="flex";
    }
};

/* =========================================================
   CAMERA MOUSE
========================================================= */

let mouseDown=false;
let lastMouseX=0;
let lastMouseY=0;

canvas.addEventListener("pointerdown",e=>{
    mouseDown=true;
    lastMouseX=e.clientX;
    lastMouseY=e.clientY;
    canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove",e=>{
    if(!mouseDown || !playing) return;

    const dx=e.clientX-lastMouseX;
    const dy=e.clientY-lastMouseY;

    lastMouseX=e.clientX;
    lastMouseY=e.clientY;

    camera.targetYaw -= dx*.008;
    camera.targetPitch -= dy*.006;

    camera.targetPitch=Math.max(-.9,Math.min(1.1,camera.targetPitch));
});

canvas.addEventListener("pointerup",()=>{
    mouseDown=false;
});

canvas.addEventListener("pointercancel",()=>{
    mouseDown=false;
});

canvas.addEventListener("wheel",e=>{
    if(!playing)return;

    camera.targetDistance += e.deltaY*.008;
    camera.targetDistance=Math.max(4,Math.min(14,camera.targetDistance));
},{passive:true});

/* =========================================================
   MOBILE JOYSTICK
========================================================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyX=0;
let joyY=0;
let joyActive=false;

function updateJoystick(e){
    const r=joystick.getBoundingClientRect();

    let x=e.clientX-(r.left+r.width/2);
    let y=e.clientY-(r.top+r.height/2);

    const max=45;
    const len=Math.sqrt(x*x+y*y);

    if(len>max){
        x=x/len*max;
        y=y/len*max;
    }

    joyX=x/max;
    joyY=y/max;

    stick.style.transform=`translate(${x}px,${y}px)`;
}

joystick.addEventListener("pointerdown",e=>{
    joyActive=true;
    joystick.setPointerCapture(e.pointerId);
    updateJoystick(e);
});

joystick.addEventListener("pointermove",e=>{
    if(joyActive)updateJoystick(e);
});

joystick.addEventListener("pointerup",()=>{
    joyActive=false;
    joyX=0;
    joyY=0;
    stick.style.transform="translate(0,0)";
});

/* =========================================================
   ATTACK / DASH
========================================================= */

function attack(){
    if(!playing)return;

    player.attackTimer=.3;

    const msg=document.getElementById("message");
    msg.textContent="⚔️ ATTACK!";
    msg.style.opacity="1";

    setTimeout(()=>{
        msg.style.opacity="0";
    },250);
}

function dash(){
    if(!playing || player.dashTimer>0)return;

    player.dashTimer=.5;

    const speed=1.4;

    player.x += Math.sin(player.angle)*speed;
    player.z += Math.cos(player.angle)*speed;
}

/* Buttons */

document.getElementById("attack").onclick=attack;
document.getElementById("dash").onclick=dash;

/* =========================================================
   2D PROJECTION
========================================================= */

function project(x,y,z){
    /*
       Simple camera-relative 3D projection.
       This is intentionally self-contained and does not
       require WebGL or any external engine.
    */

    const dx=x-player.x;
    const dz=z-player.z;

    const cy=Math.cos(camera.yaw);
    const sy=Math.sin(camera.yaw);

    const rx=dx*cy-dz*sy;
    const rz=dx*sy+dz*cy;

    const cp=Math.cos(camera.pitch);
    const sp=Math.sin(camera.pitch);

    const ry=y*cp-rz*sp;
    const rz2=y*sp+rz*cp;

    const depth=rz2+camera.distance;

    if(depth<=.1)return null;

    const scale=520/depth;

    return {
        x:W/2+rx*scale,
        y:H*.55-ry*scale,
        scale,
        depth
    };
}

/* =========================================================
   DRAW HELPERS
========================================================= */

function cube(x,y,z,w,h,d,color){
    const p=project(x,y,z);

    if(!p)return;

    const sw=w*p.scale;
    const sh=h*p.scale;

    ctx.fillStyle=color;

    ctx.fillRect(
        p.x-sw/2,
        p.y-sh,
        sw,
        sh
    );

    ctx.strokeStyle="rgba(0,0,0,.3)";
    ctx.strokeRect(
        p.x-sw/2,
        p.y-sh,
        sw,
        sh
    );
}

function circle3D(x,y,z,r,color){
    const p=project(x,y,z);

    if(!p)return;

    ctx.beginPath();
    ctx.arc(
        p.x,
        p.y,
        Math.max(2,r*p.scale),
        0,
        Math.PI*2
    );

    ctx.fillStyle=color;
    ctx.fill();
}

function line3D(x1,y1,z1,x2,y2,z2,width,color){
    const a=project(x1,y1,z1);
    const b=project(x2,y2,z2);

    if(!a || !b)return;

    ctx.beginPath();
    ctx.moveTo(a.x,a.y);
    ctx.lineTo(b.x,b.y);

    ctx.lineWidth=Math.max(1,width*a.scale);
    ctx.strokeStyle=color;
    ctx.stroke();
}

/* =========================================================
   WORLD
========================================================= */

const trees=[];
const enemies=[];

for(let i=0;i<35;i++){

    let a=Math.random()*Math.PI*2;
    let r=7+Math.random()*22;

    trees.push({
        x:Math.cos(a)*r,
        z:Math.sin(a)*r,
        size:.8+Math.random()*.8
    });
}

for(let i=0;i<8;i++){

    let a=Math.random()*Math.PI*2;
    let r=6+Math.random()*15;

    enemies.push({
        x:Math.cos(a)*r,
        z:Math.sin(a)*r,
        size:1
    });
}

/* =========================================================
   DRAW GROUND
========================================================= */

function drawGround(){

    ctx.fillStyle="#75bfe8";
    ctx.fillRect(0,0,W,H);

    const ground=project(0,0,0);

    if(!ground)return;

    ctx.fillStyle="#315c37";

    const size=Math.max(W,H)*1.5;

    ctx.beginPath();
    ctx.ellipse(
        ground.x,
        ground.y+100,
        size,
        size*.45,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       Grid-like ground details
    */

    for(let i=-30;i<=30;i+=3){

        line3D(
            -30,0,i,
            30,0,i,
            .02,
            "rgba(255,255,255,.035)"
        );

        line3D(
            i,0,-30,
            i,0,30,
            .02,
            "rgba(255,255,255,.035)"
        );
    }
}

/* =========================================================
   TREES
========================================================= */

function drawTree(t){

    cube(
        t.x,
        1*t.size,
        t.z,
        .45*t.size,
        2*t.size,
        .45*t.size,
        "#57361f"
    );

    circle3D(
        t.x,
        2.6*t.size,
        t.z,
        1.25*t.size,
        "#24733a"
    );

    circle3D(
        t.x-.5*t.size,
        2.3*t.size,
        t.z+.1,
        .8*t.size,
        "#2e8d45"
    );
}

/* =========================================================
   ENEMY
========================================================= */

function drawEnemy(e){

    cube(
        e.x,
        1,
        e.z,
        .9,
        1.6,
        .65,
        "#b52e3d"
    );

    circle3D(
        e.x,
        2.15,
        e.z,
        .55,
        "#e65b5b"
    );

    /*
       eyes
    */

    circle3D(
        e.x-.18,
        2.2,
        e.z-.48,
        .08,
        "#ffff66"
    );

    circle3D(
        e.x+.18,
        2.2,
        e.z-.48,
        .08,
        "#ffff66"
    );
}

/* =========================================================
   PLAYER
========================================================= */

function drawPlayer(){

    const x=player.x;
    const z=player.z;

    /*
       legs
    */

    cube(
        x-.22,
        .65,
        z,
        .25,
        1.2,
        .3,
        "#222a3b"
    );

    cube(
        x+.22,
        .65,
        z,
        .25,
        1.2,
        .3,
        "#222a3b"
    );

    /*
       boots
    */

    cube(
        x-.22,
        .05,
        z-.12,
        .38,
        .25,
        .55,
        "#10151f"
    );

    cube(
        x+.22,
        .05,
        z-.12,
        .38,
        .25,
        .55,
        "#10151f"
    );

    /*
       body
    */

    cube(
        x,
        1.45,
        z,
        .95,
        1.45,
        .55,
        player.color
    );

    /*
       arms
    */

    cube(
        x-.68,
        1.45,
        z,
        .25,
        1.15,
        .3,
        player.color
    );

    cube(
        x+.68,
        1.45,
        z,
        .25,
        1.15,
        .3,
        player.color
    );

    /*
       head
    */

    circle3D(
        x,
        2.65,
        z,
        .65,
        "#f0bd8c"
    );

    /*
       hair
    */

    circle3D(
        x,
        3.02,
        z+.02,
        .68,
        "#172033"
    );

    /*
       eyes
    */

    circle3D(
        x-.2,
        2.7,
        z-.58,
        .08,
        "#ffffff"
    );

    circle3D(
        x+.2,
        2.7,
        z-.58,
        .08,
        "#ffffff"
    );

    /*
       sword
    */

    const swordAngle=player.angle;

    const sx=x+Math.sin(swordAngle)*.9;
    const sz=z+Math.cos(swordAngle)*.9;

    line3D(
        x,
        1.4,
        z,
        sx,
        2.7,
        sz,
        .13,
        "#dcecff"
    );

    /*
       attack effect
    */

    if(player.attackTimer>0){

        const p=project(
            x+Math.sin(swordAngle)*1.5,
            1.7,
            z+Math.cos(swordAngle)*1.5
        );

        if(p){

            ctx.beginPath();

            ctx.arc(
                p.x,
                p.y,
                60,
                -1.4,
                1.4
            );

            ctx.strokeStyle="#8fe7ff";
            ctx.lineWidth=8;
            ctx.stroke();
        }
    }
}

/* =========================================================
   MOVEMENT
========================================================= */

function update(dt){

    if(!playing)return;

    /*
       Keyboard input
    */

    let forward=0;
    let side=0;

    if(keys["w"])forward+=1;
    if(keys["s"])forward-=1;
    if(keys["a"])side-=1;
    if(keys["d"])side+=1;

    /*
       Mobile joystick
    */

    if(Math.abs(joyX)>.05 || Math.abs(joyY)>.05){

        side=joyX;
        forward=-joyY;
    }

    const len=Math.sqrt(forward*forward+side*side);

    if(len>1){
        forward/=len;
        side/=len;
    }

    const speed=5*dt;

    /*
       Camera-relative movement
    */

    const sin=Math.sin(camera.yaw);
    const cos=Math.cos(camera.yaw);

    const moveX=
        side*cos+
        forward*sin;

    const moveZ=
        -side*sin+
        forward*cos;

    player.x+=moveX*speed;
    player.z+=moveZ*speed;

    /*
       Keep player on island
    */

    const dist=Math.sqrt(
        player.x*player.x+
        player.z*player.z
    );

    if(dist>28){

        const factor=28/dist;

        player.x*=factor;
        player.z*=factor;
    }

    /*
       Rotate character toward movement
    */

    if(len>.05){

        const target=Math.atan2(moveX,moveZ);

        let diff=target-player.angle;

        while(diff>Math.PI)diff-=Math.PI*2;
        while(diff<-Math.PI)diff+=Math.PI*2;

        player.angle+=diff*Math.min(1,dt*10);
    }

    /*
       Camera follows player
    */

    camera.targetYaw +=
        angleDifference(
            player.angle-camera.targetYaw,
            0
        )*0.0;

    /*
       Smooth camera
    */

    camera.yaw +=
        angleDifference(
            camera.targetYaw-camera.yaw,
            0
        )*Math.min(1,dt*8);

    camera.pitch +=
        (camera.targetPitch-camera.pitch)*
        Math.min(1,dt*8);

    camera.distance +=
        (camera.targetDistance-camera.distance)*
        Math.min(1,dt*8);

    /*
       Timers
    */

    if(player.attackTimer>0){
        player.attackTimer-=dt;
    }

    if(player.dashTimer>0){
        player.dashTimer-=dt;
    }
}

function angleDifference(a,b){
    let d=a-b;

    while(d>Math.PI)d-=Math.PI*2;
    while(d<-Math.PI)d+=Math.PI*2;

    return d;
}

/* =========================================================
   SORTING
========================================================= */

function drawWorld(){

    const objects=[];

    trees.forEach(t=>{
        const dx=t.x-player.x;
        const dz=t.z-player.z;

        objects.push({
            depth:dx*dx+dz*dz,
            draw:()=>drawTree(t)
        });
    });

    enemies.forEach(e=>{
        const dx=e.x-player.x;
        const dz=e.z-player.z;

        objects.push({
            depth:dx*dx+dz*dz,
            draw:()=>drawEnemy(e)
        });
    });

    objects.sort((a,b)=>b.depth-a.depth);

    objects.forEach(o=>o.draw());

    drawPlayer();
}

/* =========================================================
   MAIN LOOP
========================================================= */

let last=performance.now();

function loop(now){

    const dt=Math.min(.033,(now-last)/1000);

    last=now;

    update(dt);

    ctx.clearRect(0,0,W,H);

    /*
       Sky
    */

    const sky=ctx.createLinearGradient(0,0,0,H);

    sky.addColorStop(0,"#17385c");
    sky.addColorStop(.55,"#5ea4c7");
    sky.addColorStop(1,"#d6e5bd");

    ctx.fillStyle=sky;
    ctx.fillRect(0,0,W,H);

    drawGround();
    drawWorld();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

/* =========================================================
   PREVENT MOBILE SCROLL
========================================================= */

document.addEventListener("touchmove",e=>{
    if(playing)e.preventDefault();
},{passive:false});

</script>

</body>
</html>
