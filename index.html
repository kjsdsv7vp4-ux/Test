<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Quest</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #10152d;
  font-family: Arial, sans-serif;
}

#game {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  background: linear-gradient(#70c9f0 0%, #bde9ff 55%, #6ca84b 56%, #438038 100%);
}

/* Titel */
.logo {
  position: absolute;
  top: 35px;
  left: 40px;
  color: white;
  font-size: 65px;
  font-weight: 900;
  line-height: .8;
  text-shadow:
    5px 5px #18203c,
    9px 9px #0b1024;
  transform: rotate(-3deg);
}

.logo span {
  display: block;
}

.logo strong {
  color: #ffc62e;
  display: block;
  text-shadow:
    5px 5px #814a16,
    9px 9px #0b1024;
}

/* Menu */
.menu {
  position: absolute;
  top: 210px;
  left: 45px;
  width: 250px;
}

.menu button {
  width: 100%;
  margin: 7px 0;
  padding: 14px;
  border: 4px solid #171b32;
  border-radius: 12px;
  background: linear-gradient(#42455f, #20243c);
  color: white;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 5px #090c19;
}

.menu button:first-child {
  background: linear-gradient(#2ba4ed, #1767a8);
}

.menu button:hover {
  transform: translateY(-2px);
}

/* Werelden */
.title {
  position: absolute;
  top: 35px;
  right: 50px;
  width: 58%;
  padding: 15px;
  text-align: center;
  color: white;
  font-size: 32px;
  font-weight: bold;
  background: #11152be8;
  border: 4px solid #765d42;
  border-radius: 14px;
}

.worlds {
  position: absolute;
  top: 125px;
  right: 45px;
  width: 60%;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.world {
  padding: 8px;
  background: #11152be8;
  border: 4px solid #171b32;
  border-radius: 14px;
  color: white;
  cursor: pointer;
  box-shadow: 0 6px #080b18;
}

.world:hover {
  transform: translateY(-5px);
}

.picture {
  height: 110px;
  border-radius: 9px;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 60px;
}

.grass {
  background: linear-gradient(#73c9ef 45%, #55a94e 46%);
}

.desert {
  background: linear-gradient(#f2ce7d 45%, #c78738 46%);
}

.ice {
  background: linear-gradient(#c4efff 45%, #7fc7e2 46%);
}

.forest {
  background: linear-gradient(#354c63 45%, #244a38 46%);
}

.volcano {
  background: linear-gradient(#e89958 45%, #632d21 46%);
}

.sky {
  background: linear-gradient(#c3edff 45%, #8bcbe8 46%);
}

.world h3 {
  margin: 8px 3px 3px;
}

.world p {
  margin: 3px;
  color: #c8cee4;
  font-size: 12px;
}

/* Game */
#playScreen {
  display: none;
  position: absolute;
  inset: 0;
}

canvas {
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}

.hud {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 15px 25px;
  color: white;
  background: #10152dcc;
  font-size: 22px;
  font-weight: bold;
}

.hud button {
  padding: 8px 15px;
  background: #273354;
  color: white;
  border: 2px solid white;
  border-radius: 8px;
}

@media(max-width:800px) {
  .logo {
    font-size: 38px;
    left: 15px;
  }

  .menu {
    left: 15px;
    top: 150px;
    width: 160px;
  }

  .menu button {
    font-size: 12px;
    padding: 9px;
  }

  .title {
    right: 15px;
    top: 15px;
    width: 55%;
    font-size: 16px;
  }

  .worlds {
    right: 15px;
    top: 75px;
    width: 58%;
    gap: 6px;
  }

  .picture {
    height: 65px;
    font-size: 35px;
  }

  .world h3 {
    font-size: 10px;
  }

  .world p {
    display: none;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="menuScreen">

    <div class="logo">
      <span>PIXEL</span>
      <strong>QUEST</strong>
    </div>

    <div class="menu">
      <button onclick="startGame(0)">▶ START</button>
      <button onclick="alert('Kies een wereld!')">WERELDEN</button>
      <button onclick="alert('Instellingen komen binnenkort!')">
        INSTELLINGEN
      </button>
      <button onclick="alert('Extra content komt binnenkort!')">
        EXTRA'S
      </button>
    </div>

    <div class="title">
      ✦ KIES JE WERELD ✦
    </div>

    <div class="worlds">

      <div class="world" onclick="startGame(0)">
        <div class="picture grass">🌳</div>
        <h3>1. GRASLAND</h3>
        <p>Groene heuvels en bossen.</p>
      </div>

      <div class="world" onclick="startGame(1)">
        <div class="picture desert">🏜️</div>
        <h3>2. WOESTIJN</h3>
        <p>Zand en oude ruïnes.</p>
      </div>

      <div class="world" onclick="startGame(2)">
        <div class="picture ice">❄️</div>
        <h3>3. IJSBERG</h3>
        <p>Sneeuw en ijs.</p>
      </div>

      <div class="world" onclick="startGame(3)">
        <div class="picture forest">🌲</div>
        <h3>4. DONKER BOS</h3>
        <p>Een mysterieus bos.</p>
      </div>

      <div class="world" onclick="startGame(4)">
        <div class="picture volcano">🌋</div>
        <h3>5. VULKAAN</h3>
        <p>Lava en vuur.</p>
      </div>

      <div class="world" onclick="startGame(5)">
        <div class="picture sky">🏰</div>
        <h3>6. HEMELRIJK</h3>
        <p>Een koninkrijk boven de wolken.</p>
      </div>

    </div>
  </div>

  <div id="playScreen">

    <canvas id="canvas"></canvas>

    <div class="hud">
      <button onclick="backToMenu()">← MENU</button>
      <span id="worldName">GRASLAND</span>
      <span>❤️ <span id="lives">3</span> &nbsp; 🪙 <span id="coins">0</span></span>
    </div>

  </div>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let keys = {};
let world = 0;
let coins = 0;
let lives = 3;

let player = {
  x: 100,
  y: 400,
  width: 40,
  height: 55,
  velocityY: 0,
  speed: 5,
  jumping: false
};

const worldNames = [
  "GRASLAND",
  "WOESTIJN",
  "IJSBERG",
  "DONKER BOS",
  "VULKAAN",
  "HEMELRIJK"
];

const colors = [
  ["#70c9f0", "#55a94e"],
  ["#f2ce7d", "#c78738"],
  ["#c4efff", "#7fc7e2"],
  ["#354c63", "#244a38"],
  ["#e89958", "#632d21"],
  ["#c3edff", "#8bcbe8"]
];

let platforms = [
  {x:0,y:600,w:500,h:50},
  {x:600,y:520,w:250,h:40},
  {x:950,y:430,w:250,h:40},
  {x:1300,y:550,w:300,h:50},
  {x:1700,y:450,w:300,h:50},
  {x:2100,y:550,w:400,h:50}
];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);
resizeCanvas();

document.addEventListener("keydown", function(e) {

  keys[e.key] = true;

  if (
    e.key === " " ||
    e.key === "ArrowUp"
  ) {
    e.preventDefault();
  }

});

document.addEventListener("keyup", function(e) {
  keys[e.key] = false;
});

function startGame(selectedWorld) {

  world = selectedWorld;

  document.getElementById("menuScreen").style.display = "none";
  document.getElementById("playScreen").style.display = "block";

  document.getElementById("worldName").textContent =
    worldNames[world];

  player.x = 100;
  player.y = 400;
  player.velocityY = 0;

  coins = 0;
  lives = 3;

  document.getElementById("coins").textContent = coins;
  document.getElementById("lives").textContent = lives;

  gameLoop();
}

function backToMenu() {

  document.getElementById("playScreen").style.display = "none";
  document.getElementById("menuScreen").style.display = "block";

}

function update() {

  if (keys["ArrowRight"] || keys["d"]) {
    player.x += player.speed;
  }

  if (keys["ArrowLeft"] || keys["a"]) {
    player.x -= player.speed;
  }

  if (
    (keys[" "] || keys["ArrowUp"] || keys["w"]) &&
    !player.jumping
  ) {

    player.velocityY = -13;
    player.jumping = true;

  }

  player.velocityY += 0.6;

  player.y += player.velocityY;

  player.jumping = true;

  for (let platform of platforms) {

    if (
      player.x + player.width > platform.x &&
      player.x < platform.x + platform.w &&
      player.y + player.height >= platform.y &&
      player.y + player.height <= platform.y + 25 &&
      player.velocityY >= 0
    ) {

      player.y = platform.y - player.height;
      player.velocityY = 0;
      player.jumping = false;

    }

  }

  if (player.y > canvas.height + 100) {

    lives--;

    document.getElementById("lives").textContent = lives;

    player.x = 100;
    player.y = 300;
    player.velocityY = 0;

    if (lives <= 0) {

      alert("GAME OVER!");
      backToMenu();

    }

  }

}

function draw() {

  const c = colors[world];

  ctx.clearRect(0,0,canvas.width,canvas.height);

  /* Achtergrond */

  const gradient = ctx.createLinearGradient(
    0,
    0,
    0,
    canvas.height
  );

  gradient.addColorStop(0,c[0]);
  gradient.addColorStop(1,"#f4c99d");

  ctx.fillStyle = gradient;
  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  /* Bergen */

  ctx.fillStyle = c[1];

  for(let x = -100; x < canvas.width + 500; x += 450){

    ctx.beginPath();

    ctx.moveTo(x,canvas.height);

    ctx.lineTo(
      x + 220,
      canvas.height - 300
    );

    ctx.lineTo(
      x + 450,
      canvas.height
    );

    ctx.fill();

  }

  /* Platforms */

  ctx.fillStyle = c[1];

  for(let platform of platforms){

    ctx.fillRect(
      platform.x,
      platform.y,
      platform.w,
      platform.h
    );

    ctx.fillStyle = "#263d2a";

    ctx.fillRect(
      platform.x,
      platform.y,
      platform.w,
      7
    );

    ctx.fillStyle = c[1];

  }

  /* Speler */

  ctx.fillStyle = "#1e4d9b";

  ctx.fillRect(
    player.x,
    player.y + 20,
    player.width,
    player.height - 20
  );

  ctx.fillStyle = "#f0b27b";

  ctx.fillRect(
    player.x + 7,
    player.y,
    26,
    25
  );

  ctx.fillStyle = "#171c35";

  ctx.fillRect(
    player.x + 3,
    player.y - 5,
    32,
    9
  );

}

function gameLoop() {

  update();
  draw();

  if (
    document.getElementById("playScreen").style.display !== "none"
  ) {

    requestAnimationFrame(gameLoop);

  }

}

</script>

</body>
</html>
