<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Realm of Blades</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#080812;
    color:white;
    font-family:monospace;
    image-rendering:pixelated;
}

body{
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    image-rendering:pixelated;
    background:#101523;
}

/* =========================
   START MENU
========================= */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 35%,#243b59 0%,#101522 35%,#070811 75%);
}

#menu:before{
    content:"";
    position:absolute;
    inset:0;
    opacity:.3;
    background:
        linear-gradient(90deg,transparent 49%,rgba(255,255,255,.03) 50%,transparent 51%),
        linear-gradient(0deg,transparent 49%,rgba(255,255,255,.03) 50%,transparent 51%);
    background-size:32px 32px;
}

.menuBox{
    position:relative;
    width:min(700px,92vw);
    padding:50px 25px 35px;
    text-align:center;
    border:4px solid #8c6b39;
    background:linear-gradient(#17192b,#0b0c17);
    box-shadow:
        0 0 0 5px #29223b,
        0 0 50px #000;
}

.logo{
    font-size:clamp(32px,7vw,68px);
    letter-spacing:4px;
    color:#f3d477;
    text-shadow:
        4px 4px #4b2d35,
        0 0 18px #e4a94c;
}

.subtitle{
    margin-top:8px;
    color:#9caed0;
    font-size:14px;
    letter-spacing:3px;
}

.menuSword{
    margin:35px auto 28px;
    width:180px;
    height:18px;
    position:relative;
    transform:rotate(-18deg);
    background:#dce9ff;
    box-shadow:
        0 0 0 4px #343a52,
        80px 0 #c8993c;
}

.menuSword:before{
    content:"";
    position:absolute;
    width:35px;
    height:30px;
    left:-25px;
    top:-6px;
    background:#b47b36;
    border:4px solid #513525;
}

.menuSword:after{
    content:"";
    position:absolute;
    width:15px;
    height:45px;
    left:-40px;
    top:-13px;
    background:#4b2f23;
    border:4px solid #1d1520;
}

.menuButton{
    width:270px;
    max-width:85%;
    padding:15px;
    margin:9px auto;
    display:block;
    cursor:pointer;
    color:white;
    font:bold 16px monospace;
    background:#272541;
    border:3px solid #8d7442;
    box-shadow:inset 0 -5px #161523;
}

.menuButton:hover{
    background:#3d385e;
    border-color:#e1bb61;
    transform:translateY(-2px);
}

.smallText{
    margin-top:22px;
    color:#67718d;
    font-size:11px;
}

/* =========================
   STORY
========================= */

#story{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle,#263047 0%,#0b0d16 55%,#030308 100%);
}

.storyStars{
    position:absolute;
    inset:0;
    background-image:
        radial-gradient(#fff 1px,transparent 1px),
        radial-gradient(#aaa 1px,transparent 1px);
    background-size:83px 83px,137px 137px;
    opacity:.3;
}

.storyBox{
    position:relative;
    width:min(850px,90vw);
    text-align:center;
    padding:40px 25px;
}

.storyTitle{
    color:#e6c56d;
    font-size:clamp(25px,5vw,52px);
    letter-spacing:5px;
    text-shadow:4px 4px #211c35;
}

.storyChapter{
    color:#9aa9c7;
    margin:15px;
}

#storyText{
    min-height:100px;
    margin:35px auto;
    max-width:700px;
    color:#e9e9f2;
    font-size:clamp(14px,2.5vw,21px);
    line-height:1.7;
}

#storySkip{
    padding:12px 25px;
    background:#24223a;
    border:2px solid #90733e;
    color:white;
    font:bold 14px monospace;
}

/* =========================
   HUD
========================= */

#hud{
    position:fixed;
    inset:0;
    z-index:20;
    pointer-events:none;
    display:none;
}

.stats{
    position:absolute;
    left:15px;
    top:15px;
    width:250px;
    padding:10px;
    background:rgba(8,9,18,.84);
    border:3px solid #554763;
    box-shadow:0 5px 15px #0008;
}

.bar{
    height:15px;
    margin:4px 0;
    border:2px solid #111;
    background:#20202b;
}

.barFill{
    height:100%;
    width:100%;
}

.hp{
    background:#d33b4c;
}

.mp{
    background:#477ed8;
}

.xp{
    background:#bd8d3c;
}

.statText{
    font-size:11px;
}

.weapon{
    color:#e9cc74;
    margin-top:6px;
    font-size:12px;
}

#message{
    position:absolute;
    left:50%;
    top:18%;
    transform:translateX(-50%);
    padding:10px 20px;
    background:#0a0b13e8;
    border:2px solid #b9954e;
    color:#fff0a9;
    display:none;
    text-align:center;
    font-weight:bold;
}

/* =========================
   DIALOGUE
========================= */

#dialogue{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translateX(-50%);
    z-index:80;
    width:min(850px,92vw);
    min-height:145px;
    padding:20px 22px;
    background:
        linear-gradient(180deg,#171629f8,#090a12f8);
    border:4px solid #9a793f;
    box-shadow:
        0 0 0 3px #2d2740,
        0 10px 30px #000;
    display:none;
}

.dialogueName{
    color:#ffd66e;
    font-size:18px;
    font-weight:bold;
    margin-bottom:12px;
}

#dialogueText{
    font-size:15px;
    line-height:1.55;
    min-height:55px;
    padding-right:80px;
}

#dialogueNext{
    position:absolute;
    right:15px;
    bottom:12px;
    padding:7px 12px;
    color:white;
    background:#30294a;
    border:2px solid #a88446;
    font:bold 12px monospace;
}

/* =========================
   INVENTORY
========================= */

#inventory{
    position:fixed;
    inset:0;
    z-index:90;
    display:none;
    align-items:center;
    justify-content:center;
    background:#0009;
}

.inventoryBox{
    width:min(650px,92vw);
    max-height:85vh;
    overflow:auto;
    padding:22px;
    background:#11121e;
    border:4px solid #8c7041;
    box-shadow:0 0 0 4px #302941,0 20px 50px #000;
}

.inventoryTitle{
    color:#e7c76f;
    font-size:25px;
    margin-bottom:18px;
}

.item{
    padding:12px;
    margin:7px 0;
    background:#1e2030;
    border:2px solid #39374c;
}

.closeBtn{
    margin-top:15px;
    padding:10px 20px;
    color:white;
    background:#30294a;
    border:2px solid #967742;
}

/* =========================
   ABILITIES
========================= */

#abilities{
    position:absolute;
    right:15px;
    bottom:15px;
    width:300px;
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
    pointer-events:auto;
}

.ability{
    height:50px;
    color:#fff;
    background:#171827e8;
    border:2px solid #49445c;
    font:bold 10px monospace;
}

.ability:hover{
    background:#38334f;
    border-color:#d0a854;
}

/* =========================
   MOBILE
========================= */

#touch{
    position:absolute;
    left:18px;
    bottom:20px;
    width:150px;
    height:150px;
    pointer-events:auto;
}

.touchBtn{
    position:absolute;
    width:50px;
    height:50px;
    background:#1a1a28cc;
    border:3px solid #77718a;
    color:white;
    font:bold 20px monospace;
}

#up{left:50px;top:0}
#left{left:0;top:50px}
#down{left:50px;top:100px}
#right{left:100px;top:50px}

#talkBtn{
    position:absolute;
    right:25px;
    bottom:80px;
    width:90px;
    height:50px;
    background:#26203d;
    color:white;
    border:3px solid #a68146;
    font:bold 12px monospace;
    pointer-events:auto;
}

/* =========================
   BOSS BAR
========================= */

#bossBar{
    position:absolute;
    top:15px;
    left:50%;
    transform:translateX(-50%);
    width:min(600px,75vw);
    display:none;
    text-align:center;
}

#bossName{
    color:#ffb0a9;
    font-weight:bold;
    font-size:15px;
    text-shadow:2px 2px #000;
}

#bossHp{
    height:18px;
    margin-top:5px;
    border:3px solid #32151d;
    background:#170b0e;
}

#bossHpFill{
    height:100%;
    width:100%;
    background:#c93249;
}

/* =========================
   PAUSE
========================= */

#pause{
    position:fixed;
    inset:0;
    z-index:150;
    display:none;
    align-items:center;
    justify-content:center;
    background:#0009;
}

.pauseBox{
    padding:35px 55px;
    text-align:center;
    background:#11121e;
    border:4px solid #8e7040;
}

.pauseBox h2{
    color:#e4c56f;
}
</style>
</head>

<body>

<canvas id="gameCanvas"></canvas>

<!-- =========================
     START MENU
========================= -->

<div id="menu">
    <div class="menuBox">

        <div class="logo">REALM OF BLADES</div>
        <div class="subtitle">THE FALLEN KINGDOM</div>

        <div class="menuSword"></div>

        <button class="menuButton" id="startBtn">
            ▶ START ADVENTURE
        </button>

        <button class="menuButton" id="continueBtn">
            CONTINUE
        </button>

        <div class="smallText">
            WASD / ARROWS • SPACE ATTACK • E TALK • I INVENTORY
        </div>

    </div>
</div>

<!-- =========================
     STORY
========================= -->

<div id="story">

    <div class="storyStars"></div>

    <div class="storyBox">

        <div class="storyTitle">
            REALM OF BLADES
        </div>

        <div class="storyChapter">
            CHAPTER I — THE FALLEN KINGDOM
        </div>

        <div id="storyText"></div>

        <button id="storySkip">
            SKIP ▶
        </button>

    </div>

</div>

<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div class="stats">

        <div class="statText">
            LV <span id="level">1</span>
            &nbsp; • &nbsp;
            XP <span id="xp">0</span>/100
        </div>

        <div class="bar">
            <div id="hpFill" class="barFill hp"></div>
        </div>

        <div class="statText">
            HP <span id="hp">100</span>/100
        </div>

        <div class="bar">
            <div id="mpFill" class="barFill mp"></div>
        </div>

        <div class="statText">
            MP <span id="mp">100</span>/100
        </div>

        <div class="bar">
            <div id="xpFill" class="barFill xp"></div>
        </div>

        <div class="weapon">
            ⚔ <span id="weapon">Rusty Blade</span>
        </div>

        <div>
            💰 <span id="gold">50</span>
        </div>

    </div>

    <div id="bossBar">
        <div id="bossName"></div>
        <div id="bossHp">
            <div id="bossHpFill"></div>
        </div>
    </div>

    <div id="message"></div>

    <div id="abilities"></div>

    <div id="touch">

        <button class="touchBtn" id="up">▲</button>
        <button class="touchBtn" id="left">◀</button>
        <button class="touchBtn" id="down">▼</button>
        <button class="touchBtn" id="right">▶</button>

    </div>

    <button id="talkBtn">TALK</button>

</div>

<!-- =========================
     DIALOGUE
========================= -->

<div id="dialogue">

    <div class="dialogueName" id="dialogueName">
        NPC
    </div>

    <div id="dialogueText"></div>

    <button id="dialogueNext">
        NEXT ▶
    </button>

</div>

<!-- =========================
     INVENTORY
========================= -->

<div id="inventory">

    <div class="inventoryBox">

        <div class="inventoryTitle">
            INVENTORY
        </div>

        <div id="inventoryItems"></div>

        <button class="closeBtn" id="closeInventory">
            CLOSE
        </button>

    </div>

</div>

<!-- =========================
     PAUSE
========================= -->

<div id="pause">

    <div class="pauseBox">

        <h2>PAUSED</h2>

        <p>Press ESC to continue</p>

        <button class="closeBtn" id="resumeBtn">
            RESUME
        </button>

    </div>

</div>

<script>
"use strict";

/* =========================================================
   CANVAS
========================================================= */

const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=innerWidth;
    H=innerHeight;

    canvas.width=W;
    canvas.height=H;
}

addEventListener("resize",resize);
resize();

/* =========================================================
   AUDIO ENGINE
========================================================= */

let audioContext=null;
let masterGain=null;
let musicTimer=null;
let musicRunning=false;
let currentMusic="normal";

function initAudio(){

    if(audioContext)return;

    audioContext=
        new (window.AudioContext||
        window.webkitAudioContext)();

    masterGain=
        audioContext.createGain();

    masterGain.gain.value=.18;

    masterGain.connect(
        audioContext.destination
    );
}

function tone(
    frequency,
    duration=.15,
    type="square",
    volume=.05
){

    if(!audioContext)return;

    const osc=
        audioContext.createOscillator();

    const gain=
        audioContext.createGain();

    osc.type=type;
    osc.frequency.value=frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime+duration
    );

    osc.connect(gain);
    gain.connect(masterGain);

    osc.start();

    osc.stop(
        audioContext.currentTime+
        duration
    );
}

/* =========================================================
   MUSIC THEMES
========================================================= */

const normalTheme={
    notes:[
        196,220,261,220,
        174,196,233,196,
        146,174,220,174
    ],
    tempo:430,
    wave:"triangle"
};

const shadowTheme={
    notes:[
        73,73,87,65,
        73,98,87,65,
        58,65,73,61
    ],
    tempo:260,
    wave:"sawtooth"
};

const dragonTheme={
    notes:[
        55,65,73,82,
        98,82,73,65,
        55,73,98,110,
        98,82,65,55
    ],
    tempo:220,
    wave:"square"
};

const voidTheme={
    notes:[
        58,61,73,69,
        58,82,61,49,
        55,73,69,61,
        49,58,65,43
    ],
    tempo:300,
    wave:"sawtooth"
};

let musicIndex=0;

function playMusicNote(theme){

    if(!musicRunning || currentMusic!==theme)
        return;

    const note=
        theme.notes[
            musicIndex%theme.notes.length
        ];

    tone(
        note,
        theme.tempo/1000*.8,
        theme.wave,
        .035
    );

    if(Math.random()<.35){

        tone(
            note/2,
            theme.tempo/1000*.8,
            "triangle",
            .025
        );
    }

    musicIndex++;

    musicTimer=setTimeout(
        ()=>playMusicNote(theme),
        theme.tempo
    );
}

function startMusic(themeName){

    stopMusic();

    currentMusic=themeName;
    musicRunning=true;
    musicIndex=0;

    let theme=normalTheme;

    if(themeName==="shadow")
        theme=shadowTheme;

    if(themeName==="dragon")
        theme=dragonTheme;

    if(themeName==="void")
        theme=voidTheme;

    playMusicNote(theme);
}

function stopMusic(){

    musicRunning=false;

    if(musicTimer){
        clearTimeout(musicTimer);
        musicTimer=null;
    }
}

function soundAttack(){

    tone(120,.08,"square",.08);
    tone(80,.12,"sawtooth",.04);
}

function soundHit(){

    tone(90,.08,"square",.06);
    tone(60,.12,"square",.04);
}

function soundPickup(){

    tone(523,.08,"triangle",.06);

    setTimeout(
        ()=>tone(784,.12,"triangle",.05),
        80
    );
}

function soundTalk(){

    tone(500,.035,"square",.025);
}

/* =========================================================
   PLAYER
========================================================= */

const player={
    x:0,
    y:0,

    hp:100,
    maxHp:100,

    mp:100,
    maxMp:100,

    level:1,
    xp:0,
    nextXP:100,

    gold:50,

    speed:2.6,

    sword:null,

    attackCooldown:0,
    invincible:0,

    facingX:1,
    facingY:0,

    attackFlash:0,

    buffs:{
        berserk:0,
        shield:0
    }
};

const swords=[
    {
        name:"Rusty Blade",
        rarity:"COMMON",
        power:8,
        color:"#aaa"
    },
    {
        name:"Oak Sword",
        rarity:"UNCOMMON",
        power:13,
        color:"#65c27b"
    },
    {
        name:"Knight Edge",
        rarity:"RARE",
        power:21,
        color:"#5794e5"
    },
    {
        name:"Arcane Saber",
        rarity:"EPIC",
        power:34,
        color:"#b45ee9"
    },
    {
        name:"Dragon Slayer",
        rarity:"LEGENDARY",
        power:55,
        color:"#f0a83c"
    }
];

player.sword=swords[0];

/* =========================================================
   INVENTORY
========================================================= */

const inventory=[
    {
        name:"Rusty Blade",
        type:"Sword",
        rarity:"COMMON"
    },
    {
        name:"Small Potion",
        type:"Consumable",
        amount:3
    }
];

function addItem(item){

    inventory.push(item);

    soundPickup();

    renderInventory();
}

function renderInventory(){

    const box=
        document.getElementById(
            "inventoryItems"
        );

    box.innerHTML="";

    inventory.forEach(item=>{

        const div=
            document.createElement("div");

        div.className="item";

        if(item.type==="Sword"){

            div.innerHTML=
                "⚔ <b>"+
                item.name+
                "</b><br>"+
                item.rarity;

        }else{

            div.innerHTML=
                "🧪 "+
                item.name+
                " ×"+
                (item.amount||1);
        }

        box.appendChild(div);
    });
}

/* =========================================================
   WORLD
========================================================= */

const WORLD_SIZE=4200;

const trees=[];
const buildings=[];
const enemies=[];
const particles=[];
const npcs=[];
const bosses=[];

function random(min,max){
    return Math.random()*(max-min)+min;
}

function createWorld(){

    trees.length=0;
    buildings.length=0;
    enemies.length=0;
    npcs.length=0;
    bosses.length=0;

    for(let i=0;i<160;i++){

        let x=random(
            -WORLD_SIZE/2,
            WORLD_SIZE/2
        );

        let y=random(
            -WORLD_SIZE/2,
            WORLD_SIZE/2
        );

        if(Math.hypot(x,y)<300)
            continue;

        trees.push({
            x,
            y,
            type:Math.floor(random(0,3))
        });
    }

    buildings.push(
        {
            x:-240,
            y:-180,
            w:220,
            h:150,
            name:"VILLAGE",
            color:"#725239"
        },
        {
            x:120,
            y:-190,
            w:170,
            h:120,
            name:"BLACKSMITH",
            color:"#463c3d"
        },
        {
            x:-190,
            y:100,
            w:160,
            h:120,
            name:"SHOP",
            color:"#526048"
        },
        {
            x:1200,
            y:-900,
            w:280,
            h:210,
            name:"CASTLE",
            color:"#34364e"
        }
    );

    /* NPCs */

    npcs.push(
        {
            name:"ELIAS",
            x:-100,
            y:-50,
            color:"#315e8d",
            voice:{
                rate:.86,
                pitch:.95
            },
            dialogue:[
                "Wacht... jij bent een krijger, toch?",
                "Het koninkrijk is niet meer zoals vroeger.",
                "Monsters zijn uit de duisternis gekomen.",
                "Als je verder reist, wees dan voorzichtig."
            ]
        },
        {
            name:"THORIN DE SMID",
            x:205,
            y:-125,
            color:"#7a4c32",
            voice:{
                rate:.72,
                pitch:.55
            },
            dialogue:[
                "Ah! Een nieuwe krijger!",
                "Ik kan de beste zwaarden van Eldoria smeden.",
                "Van Common helemaal tot Legendary.",
                "Maar voor de sterkste zwaarden heb je zeldzame materialen nodig."
            ]
        },
        {
            name:"MIRA DE MAGIËR",
            x:-100,
            y:160,
            color:"#633d96",
            voice:{
                rate:.88,
                pitch:1.3
            },
            dialogue:[
                "Ik voel een vreemde kracht in jou.",
                "Je kunt meer dan alleen met een zwaard vechten.",
                "Leer de oude abilities en gebruik ze verstandig.",
                "Sommige krachten zijn sterker dan je je kunt voorstellen..."
            ]
        },
        {
            name:"DE OUDE KONING",
            x:1320,
            y:-1000,
            color:"#a47c28",
            voice:{
                rate:.65,
                pitch:.7
            },
            dialogue:[
                "Dus jij hebt eindelijk mijn kasteel gevonden...",
                "Het koninkrijk werd niet zomaar aangevallen.",
                "Iemand heeft de poort naar de duisternis geopend.",
                "Vind de legendarische zwaarden.",
                "Alleen daarmee ontdek je de waarheid."
            ]
        }
    );

    /* Normal enemies */

    const enemyTypes=[
        {
            name:"Goblin",
            color:"#65a34b",
            hp:45,
            damage:8,
            speed:1.0
        },
        {

/* =========================================================
   PARTICLES
========================================================= */

function particle(
    x,
    y,
    color,
    size=4,
    life=30
){

    particles.push({
        x,
        y,
        vx:random(-2,2),
        vy:random(-2,2),
        color,
        size,
        life,
        maxLife:life
    });
}

function updateParticles(){

    for(let i=particles.length-1;i>=0;i--){

        const p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;

        p.vy+=.03;

        p.life--;

        if(p.life<=0)
            particles.splice(i,1);
    }
}

function drawParticles(){

    for(const p of particles){

        const a=
            p.life/p.maxLife;

        ctx.globalAlpha=a;

        ctx.fillStyle=p.color;

        ctx.fillRect(
            p.x,
            p.y,
            p.size,
            p.size
        );
    }

    ctx.globalAlpha=1;
}

   CAMERA
========================================================= */

const camera={
    x:0,
    y:0
};

function updateCamera(){

    const targetX=
        player.x-W/2;

    const targetY=
        player.y-H/2;

    camera.x+=
        (targetX-camera.x)*.09;

    camera.y+=
        (targetY-camera.y)*.09;
}

/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld(){

    ctx.fillStyle="#263c2c";
    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    const tile=32;

    const startX=
        Math.floor(camera.x/tile)*tile;

    const startY=
        Math.floor(camera.y/tile)*tile;

    for(
        let x=startX;
        x<camera.x+W+tile;
        x+=tile
    ){

        for(
            let y=startY;
            y<camera.y+H+tile;
            y+=tile
        ){

            const gx=
                Math.floor(x/tile);

            const gy=
                Math.floor(y/tile);

            const n=
                Math.abs(
                    Math.sin(
                        gx*12.9898+
                        gy*78.233
                    )
                );

            ctx.fillStyle=
                n>.5
                ?"#29422f"
                :"#263d2c";

            ctx.fillRect(
                x-camera.x,
                y-camera.y,
                tile,
                tile
            );

            if(n>.84){

                ctx.fillStyle="#31513a";

                ctx.fillRect(
                    x-camera.x+9,
                    y-camera.y+20,
                    4,
                    4
                );
            }
        }
    }

    drawPaths();
    drawBuildings();
    drawTrees();
}

/* =========================================================
   ENEMY UPDATE
========================================================= */

function updateEnemies(){

    for(const e of enemies){

        if(!e.alive)continue;

        const dx=
            player.x-e.x;

        const dy=
            player.y-e.y;

        const dist=
            Math.hypot(dx,dy);

        if(dist<350){

            e.x+=
                dx/dist*e.speed;

            e.y+=
                dy/dist*e.speed;

            if(dist<45){

                if(e.attackCooldown<=0){

                    damagePlayer(e.damage);

                    e.attackCooldown=55;
                }
            }
        }

        if(e.attackCooldown>0)
            e.attackCooldown--;
    }
}

/* =========================================================
   BOSS UPDATE
========================================================= */

function updateBosses(){

    let nearest=null;
    let nearestDistance=Infinity;

    for(const b of bosses){

        if(!b.alive)continue;

        const distance=
            Math.hypot(
                player.x-b.x,
                player.y-b.y
            );

        if(distance<600){

            if(distance<nearestDistance){

                nearestDistance=distance;
                nearest=b;
            }

            b.active=true;

        }else{

            b.active=false;
        }

        if(b.active){

            const dx=
                player.x-b.x;

            const dy=
                player.y-b.y;

            const dist=
                Math.max(
                    1,
                    Math.hypot(dx,dy)
                );

            b.x+=
                dx/dist*b.speed;

            b.y+=
                dy/dist*b.speed;

            if(
                dist<80 &&
                Math.random()<.025
            ){

                damagePlayer(
                    b.damage
                );
            }
        }
    }

    if(nearest!==currentBoss){

        if(nearest){

            currentBoss=nearest;

            startBossTheme(nearest);

            showMessage(
                "⚠ BOSS: "+
                nearest.name
            );

        }else{

            currentBoss=null;

            startMusic("normal");

            document
                .getElementById("bossBar")
                .style.display="none";
        }
    }

    if(currentBoss){

        document
            .getElementById("bossBar")
            .style.display="block";

        document
            .getElementById("bossName")
            .textContent=
                currentBoss.name;

        document
            .getElementById("bossHpFill")
            .style.width=
                Math.max(
                    0,
                    currentBoss.hp/
                    currentBoss.maxHp*
                    100
                )+"%";
    }
}

function startBossTheme(boss){

    if(boss.id==="shadow")
        startMusic("shadow");

    if(boss.id==="dragon")
        startMusic("dragon");

    if(boss.id==="void")
        startMusic("void");

    tone(55,.5,"sawtooth",.08);
    tone(73,.5,"square",.06);
    tone(98,.7,"square",.05);
}

const keys={};

    if(
        e.key===" " ||
        e.code==="Space"
    ){

        e.preventDefault();

        attack();
    }

    if(e.key==="e" || e.key==="E"){

        if(dialogueOpen){

            nextDialogue();

        }else{

            interactNPC();
        }
    }

    if(e.key==="i" || e.key==="I"){

        toggleInventory();
    }

    if(e.key==="Escape"){

        if(dialogueOpen){

            closeDialogue();

        }else{

            togglePause();
        }
    }

    if(
        e.key>="1" &&
        e.key<="9"
    ){

        useAbility(
            Number(e.key)-1
        );
    }
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;
});

========================================================= */

function holdButton(id,key){

    const button=
        document.getElementById(id);

    const start=e=>{
        e.preventDefault();
        keys[key]=true;
    };

    const stop=e=>{
        e.preventDefault();
        keys[key]=false;
    };

    button.addEventListener(
        "touchstart",
        start,
        {passive:false}
    );

    button.addEventListener(
        "touchend",
        stop,
        {passive:false}
    );

    button.addEventListener(
        "mousedown",
        start
    );

    button.addEventListener(
        "mouseup",
        stop
    );

    button.addEventListener(
        "mouseleave",
        stop
    );
}

/* =========================================================
   MOVE
========================================================= */

function updatePlayer(){

    let dx=0;
    let dy=0;

    if(
        keys["w"]||
        keys["arrowup"]
    )
        dy--;

    if(
        keys["s"]||
        keys["arrowdown"]
    )
        dy++;

    if(
        keys["a"]||
        keys["arrowleft"]
    )
        dx--;

    if(
        keys["d"]||
        keys["arrowright"]
    )
        dx++;

    if(dx||dy){

        const len=
            Math.hypot(dx,dy);

        dx/=len;
        dy/=len;

        player.x+=
            dx*player.speed;

        player.y+=
            dy*player.speed;

        player.facingX=dx;
        player.facingY=dy;
    }

    const limit=
        WORLD_SIZE/2-80;

    player.x=
        Math.max(
            -limit,
            Math.min(limit,player.x)
        );

    player.y=
        Math.max(
            -limit,
            Math.min(limit,player.y)
        );

    if(player.attackCooldown>0)
        player.attackCooldown--;

    if(player.invincible>0)
        player.invincible--;

    if(player.attackFlash>0)
        player.attackFlash--;

    if(player.buffs.berserk>0)
        player.buffs.berserk--;

    if(player.buffs.shield>0)
        player.buffs.shield--;

    if(player.mp<player.maxMp)
        player.mp+=.025;
}

/* =========================================================
   ATTACK
========================================================= */

function attack(){

    if(
        player.attackCooldown>0 ||
        dialogueOpen
    )
        return;

    player.attackCooldown=22;
    player.attackFlash=8;

    soundAttack();

    const damage=
        player.sword.power+
        player.level*3+
        (player.buffs.berserk>0?20:0);

    /* enemies */

    for(const e of enemies){

        if(!e.alive)continue;

        const dist=
            Math.hypot(
                player.x-e.x,
                player.y-e.y
            );

        if(dist<85){

            e.hp-=damage;

            soundHit();

            for(let i=0;i<6;i++)
                particle(
                    e.x,
                    e.y,
                    "#f4d36c",
                    4,
                    25
                );

            if(e.hp<=0){

                killEnemy(e);
            }
        }
    }

    /* bosses */

    for(const b of bosses){

        if(!b.alive)continue;

        const dist=
            Math.hypot(
                player.x-b.x,
                player.y-b.y
            );

        if(dist<115){

            b.hp-=damage;

            soundHit();

            for(let i=0;i<12;i++)
                particle(
                    b.x,
                    b.y,
                    "#ff5968",
                    5,
                    35
                );

            if(b.hp<=0)
                killBoss(b);
        }
    }
}

function killEnemy(e){

    e.alive=false;

    player.xp+=25;
    player.gold+=8;

    showMessage(
        "+25 XP   +8 GOLD"
    );

    for(let i=0;i<12;i++)
        particle(
            e.x,
            e.y,
            e.color,
            5,
            40
        );

    checkLevel();

    setTimeout(()=>{

        e.x=random(
            -WORLD_SIZE/2,
            WORLD_SIZE/2
        );

        e.y=random(
            -WORLD_SIZE/2,
            WORLD_SIZE/2
        );

        e.hp=e.maxHp;
        e.alive=true;

    },7000);
}

function killBoss(b){

    b.alive=false;
    b.active=false;

    player.xp+=250;
    player.gold+=500;

    showMessage(
        "BOSS DEFEATED! +250 XP +500 GOLD"
    );

    for(let i=0;i<80;i++)
        particle(
            b.x,
            b.y,
            "#ffcf62",
            7,
            80
        );

    currentBoss=null;

    startMusic("normal");

    document
        .getElementById("bossBar")
        .style.display="none";

    checkLevel();
}

/* =========================================================
   DAMAGE
========================================================= */

function damagePlayer(amount){

    if(player.invincible>0)
        return;

    if(player.buffs.shield>0)
        amount*=.35;

    player.hp-=amount;

    player.invincible=35;

    soundHit();

    if(player.hp<=0){

        player.hp=player.maxHp*.6;

        player.mp=player.maxMp;

        player.x=0;
        player.y=0;

        showMessage(
            "Je bent verslagen... Je keert terug naar het dorp."
        );
    }
}

/* =========================================================
   ABILITIES
========================================================= */

function useAbility(index){

    if(index<0 || index>=abilities.length)
        return;

    if(player.mp<abilities[index][2]){

        showMessage("Niet genoeg MP!");

        return;
    }

    player.mp-=abilities[index][2];

    const name=
        abilities[index][1];

    showMessage(name+"!");

    const power=
        player.sword.power+
        player.level*4+
        20+
        index*2;

    if(name==="Heal Wave"){

        player.hp=
            Math.min(
                player.maxHp,
                player.hp+80
            );

        for(let i=0;i<20;i++)
            particle(
                player.x,
                player.y,
                "#67e58d",
                5,
                45
            );

        return;
    }

    if(name==="Stone Skin"){

        player.buffs.shield=600;

        return;
    }

    if(name==="Berserk"){

        player.buffs.berserk=600;

        return;
    }

    if(name==="Teleport"){

        player.x+=
            player.facingX*220;

        player.y+=
            player.facingY*220;

        for(let i=0;i<20;i++)
            particle(
                player.x,
                player.y,
                "#b06cff",
                5,
                40
            );

        return;
    }

    if(name==="Time Freeze"){

        for(const e of enemies)
            e.attackCooldown=100;

        return;
    }

    /* damage around player */

    for(const e of enemies){

        if(!e.alive)continue;

        const dist=
            Math.hypot(
                player.x-e.x,
                player.y-e.y
            );

        if(dist<170){

            e.hp-=power;

            for(let i=0;i<10;i++)
                particle(
                    e.x,
                    e.y,
                    "#d76cff",
                    5,
                    35
                );

            if(e.hp<=0)
                killEnemy(e);
        }
    }

    for(const b of bosses){

        if(!b.alive)continue;

        const dist=
            Math.hypot(
                player.x-b.x,
                player.y-b.y
            );

        if(dist<200){

            b.hp-=power;

            for(let i=0;i<18;i++)
                particle(
                    b.x,
                    b.y,
                    "#ff8c8c",
                    6,
                    45
                );

            if(b.hp<=0)
                killBoss(b);
        }
    }
}

/* =========================================================
   LEVELING
========================================================= */

function checkLevel(){

    while(
        player.xp>=player.nextXP
    ){

        player.xp-=
            player.nextXP;

        player.level++;

        player.nextXP=
            Math.floor(
                player.nextXP*1.35
            );

        player.maxHp+=20;
        player.maxMp+=10;

        player.hp=
            player.maxHp;

        player.mp=
            player.maxMp;

        showMessage(
            "LEVEL UP!  LEVEL "+
            player.level
        );

        tone(523,.1,"triangle",.08);

        setTimeout(
            ()=>tone(784,.2,"triangle",.08),
            120
        );
    }
}

/* =========================================================
   NPC DIALOGUE
========================================================= */

let dialogueOpen=false;
let dialogueNPC=null;
let dialogueIndex=0;

function getNearestNPC(){

    let nearest=null;
    let distance=Infinity;

    for(const npc of npcs){

        const d=
            Math.hypot(
                player.x-npc.x,
                player.y-npc.y
            );

        if(
            d<90 &&
            d<distance
        ){

            distance=d;
            nearest=npc;
        }
    }

    return nearest;
}

function interactNPC(){

    if(dialogueOpen){

        nextDialogue();

        return;
    }

    const npc=
        getNearestNPC();

    if(!npc){

        showMessage(
            "Er is niemand om mee te praten."
        );

        return;
    }

    startDialogue(npc);
}

function startDialogue(npc){

    dialogueOpen=true;
    dialogueNPC=npc;
    dialogueIndex=0;

    document
        .getElementById("dialogue")
        .style.display="block";

    showDialogueLine();
}

function showDialogueLine(){

    const text=
        dialogueNPC.dialogue[
            dialogueIndex
        ];

    document
        .getElementById("dialogueName")
        .textContent=
            dialogueNPC.name;

    document
        .getElementById("dialogueText")
        .textContent=
            text;

    speakNPC(
        text,
        dialogueNPC.voice
    );

    soundTalk();
}

function speakNPC(text,voiceData){

    if(
        !("speechSynthesis" in window)
    )
        return;

    speechSynthesis.cancel();

    const utter=
        new SpeechSynthesisUtterance(
            text
        );

    utter.lang="nl-NL";
    utter.rate=
        voiceData?.rate||.85;
    utter.pitch=
        voiceData?.pitch||1;
    utter.volume=1;

    speechSynthesis.speak(utter);
}

function nextDialogue(){

    if(!dialogueOpen)
        return;

    dialogueIndex++;

    if(
        dialogueIndex>=
        dialogueNPC.dialogue.length
    ){

        closeDialogue();

        return;
    }

    showDialogueLine();
}

function closeDialogue(){

    speechSynthesis.cancel();

    dialogueOpen=false;
    dialogueNPC=null;

    document
        .getElementById("dialogue")
        .style.display="none";
}

document
    .getElementById("dialogueNext")
    .onclick=nextDialogue;

/* =========================================================
   MESSAGE
========================================================= */

let messageTimer=null;

function showMessage(text){

    const box=
        document.getElementById("message");

    box.textContent=text;
    box.style.display="block";

    clearTimeout(messageTimer);

    messageTimer=
        setTimeout(
            ()=>{
                box.style.display="none";
            },
            2200
        );
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document
        .getElementById("level")
        .textContent=
            player.level;

    document
        .getElementById("xp")
        .textContent=
            Math.floor(player.xp)+
            "/"+
            player.nextXP;

    document
        .getElementById("hp")
        .textContent=
            Math.floor(player.hp)+
            "/"+
            player.maxHp;

    document
        .getElementById("mp")
        .textContent=
            Math.floor(player.mp)+
            "/"+
            player.maxMp;

    document
        .getElementById("gold")
        .textContent=
            player.gold;

    document
        .getElementById("weapon")
        .textContent=
            player.sword.name;

    document
        .getElementById("hpFill")
        .style.width=
            Math.max(
                0,
                player.hp/
                player.maxHp*100
            )+"%";

    document
        .getElementById("mpFill")
        .style.width=
            Math.max(
                0,
                player.mp/
                player.maxMp*100
            )+"%";

    document
        .getElementById("xpFill")
        .style.width=
            Math.max(
                0,
                player.xp/
                player.nextXP*100
            )+"%";
}

/* =========================================================
   INVENTORY
========================================================= */

function toggleInventory(){

    const box=
        document.getElementById(
            "inventory"
        );

    const open=
        box.style.display==="flex";

    if(open){

        box.style.display="none";

    }else{

        renderInventory();

        box.style.display="flex";
    }
}

document
    .getElementById("closeInventory")
    .onclick=toggleInventory;

/* =========================================================
   PAUSE
========================================================= */

let paused=false;

function togglePause(){

    paused=!paused;

    document
        .getElementById("pause")
        .style.display=
            paused
            ?"flex"
            :"none";
}

document
    .getElementById("resumeBtn")
    .onclick=togglePause;

/* =========================================================
   INTRO STORY
========================================================= */

const storyLines=[

    "Eeuwenlang leefden de mensen van Eldoria in vrede.",

    "Maar diep onder het koninkrijk ontwaakte iets wat al duizend jaar had geslapen.",

    "Een leger van monsters verscheen uit de duisternis.",

    "De hoofdstad viel. De koning verdween.",

    "En alle legendarische zwaarden werden over het land verspreid.",

    "Jij bent de laatste krijger die nog hoop kan brengen.",

    "Vind de zwaarden. Leer de oude krachten.",

    "Versla de monsters.",

    "En ontdek wat er werkelijk met het koninkrijk is gebeurd.",

    "Jouw avontuur begint... NU."
];

let storyIndex=0;
let storyTimer=null;
let storyActive=false;

function startStory(){

    initAudio();

    document
        .getElementById("menu")
        .style.display="none";

    document
        .getElementById("story")
        .style.display="flex";

    storyActive=true;
    storyIndex=0;

    startMusic("normal");

    playStoryLine();
}

function playStoryLine(){

    if(!storyActive)
        return;

    if(
        storyIndex>=
        storyLines.length
    ){

        endStory();

        return;
    }

    const text=
        storyLines[storyIndex];

    const box=
        document.getElementById(
            "storyText"
        );

    box.textContent="";

    let i=0;

    clearInterval(storyTimer);

    storyTimer=
        setInterval(()=>{

            box.textContent+=text[i];

            i++;

            if(i>=text.length){

                clearInterval(
                    storyTimer
                );

                setTimeout(
                    ()=>{
                        storyIndex++;
                        playStoryLine();
                    },
                    1700
                );
            }

        },28);
}

function endStory(){

    storyActive=false;

    clearInterval(storyTimer);

    document
        .getElementById("story")
        .style.display="none";

    startGame();
}

document
    .getElementById("storySkip")
    .onclick=endStory;

/* =========================================================
   START GAME
========================================================= */

let gameStarted=false;

function startGame(){

    if(gameStarted)
        return;

    gameStarted=true;

    createWorld();
    buildAbilities();
    renderInventory();

    document
        .getElementById("hud")
        .style.display="block";

    player.x=0;
    player.y=0;

    startMusic("normal");

    showMessage(
        "Welkom in Eldoria!"
    );

    requestAnimationFrame(loop);
}

document
    .getElementById("startBtn")
    .onclick=()=>{

        initAudio();

        startStory();
    };

document
    .getElementById("continueBtn")
    .onclick=()=>{

        initAudio();

        showMessage(
            "Er is nog geen opgeslagen avontuur."
        );
    };

/* =========================================================
   SAVE
========================================================= */

function saveGame(){

    localStorage.setItem(
        "realmOfBladesSave",
        JSON.stringify({
            x:player.x,
            y:player.y,
            hp:player.hp,
            mp:player.mp,
            level:player.level,
            xp:player.xp,
            nextXP:player.nextXP,
            gold:player.gold,
            sword:player.sword.name
        })
    );
}

function loadGame(){

    const data=
        localStorage.getItem(
            "realmOfBladesSave"
        );

    if(!data)
        return false;

    try{

        const save=
            JSON.parse(data);

        player.x=save.x;
        player.y=save.y;
        player.hp=save.hp;
        player.mp=save.mp;
        player.level=save.level;
        player.xp=save.xp;
        player.nextXP=save.nextXP;
        player.gold=save.gold;

        const sword=
            swords.find(
                s=>s.name===save.sword
            );

        if(sword)
            player.sword=sword;

        return true;

    }catch{

        return false;
    }
}

/* autosave */

setInterval(()=>{

    if(gameStarted)
        saveGame();

},10000);

/* =========================================================
   GAME LOOP
========================================================= */

function update(){

    if(paused)
        return;

    if(dialogueOpen)
        return;

    updatePlayer();
    updateEnemies();
    updateBosses();
    updateParticles();
    updateCamera();
    updateHUD();
}

function draw(){

    drawWorld();
    drawEnemies();
    drawBosses();
    drawNPCs();
    drawParticles();
    drawPlayer();

    /* damage flash */

    if(player.invincible>0){

        ctx.fillStyle=
            "rgba(255,40,60,.08)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );
    }
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

/* =========================================================
   INITIAL STATE
========================================================= */

renderInventory();

</script>
