<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel Realm</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050914;
  font-family:Arial,sans-serif;
}

canvas{
  display:block;
  width:100%;
  height:100%;
  image-rendering:pixelated;
}

/* =========================
   START SCREEN
========================= */

#menu{
  position:fixed;
  inset:0;
  z-index:50;
  overflow:hidden;
  background:
    radial-gradient(circle at 70% 18%,rgba(108,160,255,.25),transparent 18%),
    linear-gradient(#081329 0%,#132a4b 48%,#315d75 100%);
  color:white;
}

.stars{
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle,#fff 1px,transparent 2px),
    radial-gradient(circle,#fff 1px,transparent 2px);
  background-size:83px 83px,137px 137px;
  background-position:10px 20px,40px 60px;
  opacity:.7;
}

.moon{
  position:absolute;
  width:150px;
  height:150px;
  right:12%;
  top:9%;
  border-radius:50%;
  background:#f6f0ce;
  box-shadow:
    0 0 35px rgba(255,245,190,.5),
    0 0 100px rgba(130,180,255,.2);
}

.moon:after{
  content:"";
  position:absolute;
  width:22px;
  height:22px;
  border-radius:50%;
  background:#ddd6b5;
  left:30px;
  top:35px;
  box-shadow:
    48px 25px 0 #e4ddb9,
    35px 80px 0 #d4cea9,
    82px 65px 0 #e2dbb8;
}

.mountain{
  position:absolute;
  bottom:24%;
  width:0;
  height:0;
  border-left:180px solid transparent;
  border-right:180px solid transparent;
  border-bottom:330px solid #101b32;
}

.m1{left:0}
.m2{left:22%;transform:scale(1.35)}
.m3{right:8%;transform:scale(.9)}

.menuGround{
  position:absolute;
  bottom:0;
  width:100%;
  height:29%;
  background:
    linear-gradient(#172e2a,#0c1b19);
  border-top:5px solid #263e39;
}

.menuGround:before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.35;
  background-image:
    radial-gradient(circle,#54736a 1px,transparent 2px);
  background-size:18px 18px;
}

/* HERO */

.hero{
  position:absolute;
  left:50%;
  bottom:18%;
  width:110px;
  height:190px;
  transform:translateX(-50%);
  animation:heroFloat 2.7s ease-in-out infinite;
  filter:drop-shadow(0 20px 12px rgba(0,0,0,.45));
}

@keyframes heroFloat{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-7px)}
}

.heroCape{
  position:absolute;
  width:72px;
  height:105px;
  left:20px;
  top:56px;
  background:linear-gradient(90deg,#271b48,#493178,#241936);
  clip-path:polygon(8% 0,92% 0,100% 100%,50% 86%,0 100%);
}

.heroBody{
  position:absolute;
  left:28px;
  top:61px;
  width:54px;
  height:70px;
  background:linear-gradient(#66758b,#344154);
  border:4px solid #1d2634;
  border-radius:12px 12px 8px 8px;
}

.heroArmor{
  position:absolute;
  left:34px;
  top:68px;
  width:42px;
  height:36px;
  border-radius:8px;
  background:linear-gradient(#9ca8b8,#4d5c70);
  border:3px solid #263142;
}

.heroBelt{
  position:absolute;
  left:27px;
  top:112px;
  width:56px;
  height:10px;
  background:#573d26;
  border:3px solid #2c1e13;
}

.heroBuckle{
  position:absolute;
  left:49px;
  top:110px;
  width:14px;
  height:14px;
  background:#d7b04d;
  border:3px solid #755d20;
}

.leg{
  position:absolute;
  top:124px;
  width:21px;
  height:50px;
  background:#273344;
  border:4px solid #161d28;
}

.leg.l{left:31px}
.leg.r{right:31px}

.boot{
  position:absolute;
  top:165px;
  width:31px;
  height:20px;
  background:#161a20;
  border:4px solid #080a0e;
  border-radius:4px;
}

.boot.l{left:22px}
.boot.r{right:22px}

.head{
  position:absolute;
  left:29px;
  top:17px;
  width:52px;
  height:51px;
  border-radius:13px;
  background:linear-gradient(145deg,#f1c29a,#b97854);
  border:4px solid #4d2d29;
  z-index:4;
}

.hair{
  position:absolute;
  left:25px;
  top:9px;
  width:61px;
  height:35px;
  background:#171922;
  border:4px solid #08090e;
  clip-path:polygon(
    0 50%,8% 12%,30% 0,51% 10%,74% 0,
    100% 23%,91% 65%,72% 46%,54% 67%,
    36% 47%,19% 70%
  );
  z-index:6;
}

.eye{
  position:absolute;
  top:40px;
  width:8px;
  height:8px;
  background:#10151e;
  border-radius:2px;
  z-index:7;
}

.eye.l{left:42px}
.eye.r{left:62px}

.sword{
  position:absolute;
  right:-28px;
  top:68px;
  width:13px;
  height:93px;
  background:linear-gradient(90deg,#cbd6e5,#ffffff,#9caabd);
  transform:rotate(28deg);
  border:2px solid #556275;
  box-shadow:0 0 8px rgba(200,230,255,.45);
  z-index:2;
}

.sword:after{
  content:"";
  position:absolute;
  left:-11px;
  top:66px;
  width:35px;
  height:8px;
  background:#c79a43;
  border:3px solid #654d24;
}

.menuContent{
  position:absolute;
  z-index:20;
  left:50%;
  top:10%;
  transform:translateX(-50%);
  text-align:center;
  width:min(90%,700px);
}

.logo{
  font-size:clamp(45px,9vw,100px);
  font-weight:1000;
  letter-spacing:8px;
  text-shadow:
    0 5px #1c2742,
    0 10px 0 #080d18,
    0 0 35px rgba(118,177,255,.55);
  margin:0;
}

.subtitle{
  margin-top:5px;
  color:#c9d9ef;
  letter-spacing:6px;
  font-size:13px;
}

.menuButtons{
  margin-top:30px;
  display:flex;
  flex-direction:column;
  gap:12px;
  align-items:center;
}

.menuBtn{
  width:min(330px,80vw);
  padding:16px 20px;
  border:3px solid #8297b9;
  background:linear-gradient(#384d70,#202d46);
  color:white;
  font-weight:900;
  font-size:16px;
  letter-spacing:2px;
  cursor:pointer;
  box-shadow:
    inset 0 2px rgba(255,255,255,.15),
    0 7px 0 #0b101b;
  transition:.15s;
}

.menuBtn:hover{
  transform:translateY(-3px);
  filter:brightness(1.2);
}

.menuBtn:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #0b101b;
}

.version{
  position:absolute;
  bottom:10px;
  right:14px;
  color:#75859c;
  font-size:11px;
}

/* =========================
   HUD
========================= */

#hud{
  position:fixed;
  z-index:10;
  top:12px;
  left:12px;
  width:260px;
  padding:10px;
  background:rgba(7,12,20,.84);
  border:2px solid #536783;
  box-shadow:0 8px 20px rgba(0,0,0,.35);
  color:white;
  display:none;
}

.name{
  font-weight:900;
  margin-bottom:6px;
}

.bar{
  width:100%;
  height:12px;
  background:#202735;
  border:2px solid #111722;
  margin-bottom:5px;
}

.fill{
  height:100%;
}

.hp{
  background:linear-gradient(90deg,#db3e50,#ff6670);
}

.xp{
  background:linear-gradient(90deg,#48a8ff,#a3e4ff);
}

.hudStats{
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:#ccd7e8;
}

.topButtons{
  position:fixed;
  z-index:11;
  top:12px;
  right:12px;
  display:none;
  gap:8px;
}

.topBtn{
  background:rgba(7,12,20,.88);
  border:2px solid #536783;
  color:white;
  padding:10px;
  font-weight:bold;
}

/* =========================
   MOBILE CONTROLS
========================= */

#controls{
  display:none;
  position:fixed;
  inset:0;
  z-index:15;
  pointer-events:none;
}

.joystick{
  position:absolute;
  left:25px;
  bottom:25px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(255,255,255,.09);
  border:3px solid rgba(255,255,255,.2);
  pointer-events:auto;
}

.stick{
  position:absolute;
  width:58px;
  height:58px;
  left:36px;
  top:36px;
  border-radius:50%;
  background:rgba(190,220,255,.35);
  border:3px solid rgba(255,255,255,.4);
}

.actions{
  position:absolute;
  right:25px;
  bottom:25px;
  display:flex;
  gap:12px;
  pointer-events:auto;
}

.action{
  width:70px;
  height:70px;
  border-radius:50%;
  border:3px solid #9db2cf;
  background:rgba(20,31,49,.9);
  color:white;
  font-weight:900;
  font-size:14px;
}

/* =========================
   WINDOWS
========================= */

.window{
  position:fixed;
  z-index:30;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(500px,90vw);
  max-height:75vh;
  overflow:auto;
  display:none;
  background:rgba(10,17,29,.97);
  border:3px solid #657b9e;
  color:white;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.window h2{
  margin-top:0;
}

.item{
  padding:12px;
  border:2px solid #36465e;
  margin:7px 0;
  background:#151f30;
}

.close{
  float:right;
  background:#9d3845;
  color:white;
  border:0;
  padding:7px 12px;
}

/* =========================
   DIALOGUE
========================= */

#dialogue{
  position:fixed;
  z-index:25;
  left:50%;
  bottom:35px;
  transform:translateX(-50%);
  width:min(700px,90vw);
  padding:18px;
  background:rgba(7,12,20,.94);
  border:3px solid #60779b;
  color:white;
  display:none;
}

#message{
  position:fixed;
  z-index:40;
  left:50%;
  top:20%;
  transform:translateX(-50%);
  padding:12px 20px;
  background:rgba(5,9,15,.9);
  color:white;
  border:2px solid #7289ad;
  display:none;
}
</style>
</head>

<body>

<!-- =========================
     MENU
========================= -->

<div id="menu">

  <div class="stars"></div>
  <div class="moon"></div>

  <div class="mountain m1"></div>
  <div class="mountain m2"></div>
  <div class="mountain m3"></div>

  <div class="menuGround"></div>

  <div class="hero">
    <div class="heroCape"></div>
    <div class="heroBody"></div>
    <div class="heroArmor"></div>
    <div class="heroBelt"></div>
    <div class="heroBuckle"></div>
    <div class="leg l"></div>
    <div class="leg r"></div>
    <div class="boot l"></div>
    <div class="boot r"></div>
    <div class="head"></div>
    <div class="hair"></div>
    <div class="eye l"></div>
    <div class="eye r"></div>
    <div class="sword"></div>
  </div>

  <div class="menuContent">
    <h1 class="logo">PIXEL REALM</h1>
    <div class="subtitle">THE LOST ISLANDS</div>

    <div class="menuButtons">
      <button class="menuBtn" onclick="newGame()">NEW ADVENTURE</button>
      <button class="menuBtn" onclick="loadGame()">LOAD ADVENTURE</button>
      <button class="menuBtn" onclick="showControls()">CONTROLS</button>
    </div>
  </div>

  <div class="version">VERSION 2.0</div>
</div>


<canvas id="game"></canvas>


<!-- HUD -->

<div id="hud">
  <div class="name">
    <span id="playerName">Knight</span>
    — Lv.<span id="level">1</span>
  </div>

  <div class="bar">
    <div id="hp" class="fill hp"></div>
  </div>

  <div class="bar">
    <div id="xp" class="fill xp"></div>
  </div>

  <div class="hudStats">
    <span>💰 <b id="coins">0</b></span>
    <span>⭐ <b id="xpText">0</b>/<b id="xpMax">100</b></span>
  </div>
</div>


<div class="topButtons" id="topButtons">
  <button class="topBtn" onclick="openWindow('inventory')">🎒</button>
  <button class="topBtn" onclick="openWindow('quests')">📜</button>
  <button class="topBtn" onclick="pauseGame()">Ⅱ</button>
</div>


<!-- WINDOWS -->

<div class="window" id="inventory">
  <button class="close" onclick="closeWindows()">X</button>
  <h2>🎒 Inventory</h2>

  <div class="item">⚔️ Ancient Sword</div>
  <div class="item">🛡️ Traveler Armor</div>
  <div class="item">🧪 Healing Potion × <span id="potions">3</span></div>
  <div class="item">💎 Crystal × <span id="crystals">0</span></div>
</div>


<div class="window" id="quests">
  <button class="close" onclick="closeWindows()">X</button>
  <h2>📜 Quests</h2>

  <div class="item">
    <b>The First Island</b><br>
    Explore the village.
  </div>

  <div class="item">
    <b>Monster Hunter</b><br>
    Defeat 5 monsters.
  </div>

  <div class="item">
    <b>The Lost Islands</b><br>
    Unlock the next island.
  </div>
</div>


<div id="dialogue">
  <b id="dialogueName">NPC</b>
  <div id="dialogueText"></div>
</div>

<div id="message"></div>


<!-- MOBILE -->

<div id="controls">

  <div class="joystick" id="joystick">
    <div class="stick" id="stick"></div>
  </div>

  <div class="actions">
    <button class="action" id="attackBtn">⚔️</button>
    <button class="action" id="dashBtn">💨</button>
  </div>

</div>


<script>

/* =========================================================
   PIXEL REALM 2.0
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W,H;

function resize(){
  W=canvas.width=innerWidth;
  H=canvas.height=innerHeight;
}

addEventListener("resize",resize);
resize();


/* =========================================================
   GAME SETTINGS
========================================================= */

const TILE=32;

const MAP_W=260;
const MAP_H=260;

const WORLD_W=MAP_W*TILE;
const WORLD_H=MAP_H*TILE;

let running=false;
let paused=false;

let camera={
  x:0,
  y:0,
  shake:0
};


/* =========================================================
   PLAYER
========================================================= */

const player={
  x:WORLD_W/2,
  y:WORLD_H/2,

  vx:0,
  vy:0,

  speed:190,

  hp:100,
  maxHp:100,

  level:1,
  xp:0,
  xpMax:100,

  coins:25,

  attackTimer:0,
  attackCooldown:0,

  dashTimer:0,
  dashCooldown:0,

  direction:"down",

  anim:0,
  walk:0,

  monstersKilled:0
};


/* =========================================================
   ISLANDS
========================================================= */

const islands=[
  {
    id:0,
    name:"Emerald Island",
    x:WORLD_W/2,
    y:WORLD_H/2,
    radius:1800,
    unlocked:true,
    color:"#48795b"
  },
  {
    id:1,
    name:"Frost Island",
    x:WORLD_W/2+4000,
    y:WORLD_H/2-700,
    radius:1700,
    unlocked:false,
    color:"#7ba9ba"
  },
  {
    id:2,
    name:"Volcano Island",
    x:WORLD_W/2-4300,
    y:WORLD_H/2+900,
    radius:1800,
    unlocked:false,
    color:"#8c4c3d"
  },
  {
    id:3,
    name:"Sky Island",
    x:WORLD_W/2+300,
    y:WORLD_H/2+4700,
    radius:1600,
    unlocked:false,
    color:"#7285a5"
  },
  {
    id:4,
    name:"Shadow Island",
    x:WORLD_W/2-3900,
    y:WORLD_H/2-2800,
    radius:1900,
    unlocked:false,
    color:"#40395d"
  }
];


/* =========================================================
   WORLD
========================================================= */

const objects=[];
const npcs=[];
const monsters=[];
const particles=[];
const trees=[];
const rocks=[];

function dist(a,b,c,d){
  return Math.hypot(a-c,b-d);
}

function islandAt(x,y){

  for(const island of islands){

    if(
      dist(x,y,island.x,island.y)
      < island.radius
    ){
      return island;
    }

  }

  return null;
}


/* =========================================================
   WORLD GENERATION
========================================================= */

function generateWorld(){

  trees.length=0;
  rocks.length=0;
  npcs.length=0;
  monsters.length=0;

  for(const island of islands){

    for(let i=0;i<190;i++){

      const a=Math.random()*Math.PI*2;
      const r=Math.random()*island.radius*.9;

      const x=island.x+Math.cos(a)*r;
      const y=island.y+Math.sin(a)*r;

      trees.push({
        x,
        y,
        island:island.id,
        size:.8+Math.random()*.7
      });

    }

    for(let i=0;i<100;i++){

      const a=Math.random()*Math.PI*2;
      const r=Math.random()*island.radius*.9;

      rocks.push({
        x:island.x+Math.cos(a)*r,
        y:island.y+Math.sin(a)*r,
        island:island.id
      });

    }

  }


  /* NPCs */

  npcs.push(
    {
      x:WORLD_W/2-160,
      y:WORLD_H/2-100,
      name:"Elder Rowan",
      color:"#d5a45b",
      text:"Welcome to Emerald Island, warrior!"
    },
    {
      x:WORLD_W/2+160,
      y:WORLD_H/2+100,
      name:"Mira",
      color:"#bb77d7",
      text:"The other islands are waiting for you."
    },
    {
      x:WORLD_W/2+300,
      y:WORLD_H/2-180,
      name:"Captain",
      color:"#6e9bd1",
      text:"Become stronger and unlock the sea."
    }
  );


  /* monsters */

  for(let i=0;i<35;i++){

    const island=islands[0];

    monsters.push({
      x:island.x+(Math.random()-.5)*3000,
      y:island.y+(Math.random()-.5)*3000,

      hp:40,
      maxHp:40,

      speed:55,

      alive:true,

      anim:Math.random()*10
    });

  }
}


/* =========================================================
   INPUT
========================================================= */

const keys={};

addEventListener("keydown",e=>{

  keys[e.key.toLowerCase()]=true;

  if(e.key===" "){
    attack();
  }

  if(e.key.toLowerCase()==="e"){
    interact();
  }

});

addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});


let joyX=0;
let joyY=0;

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

function joystickMove(e){

  const rect=joystick.getBoundingClientRect();

  let x=e.clientX-rect.left-65;
  let y=e.clientY-rect.top-65;

  const max=45;

  const length=Math.hypot(x,y);

  if(length>max){
    x=x/length*max;
    y=y/length*max;
  }

  joyX=x/max;
  joyY=y/max;

  stick.style.transform=
    `translate(${x}px,${y}px)`;
}

joystick.addEventListener("pointermove",joystickMove);

joystick.addEventListener("pointerdown",e=>{
  joystick.setPointerCapture(e.pointerId);
  joystickMove(e);
});

joystick.addEventListener("pointerup",()=>{
  joyX=0;
  joyY=0;
  stick.style.transform="translate(0,0)";
});


document.getElementById("attackBtn")
.addEventListener("pointerdown",attack);

document.getElementById("dashBtn")
.addEventListener("pointerdown",dash);


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(dt){

  let x=0;
  let y=0;

  if(keys["w"]||keys["arrowup"])y--;
  if(keys["s"]||keys["arrowdown"])y++;
  if(keys["a"]||keys["arrowleft"])x--;
  if(keys["d"]||keys["arrowright"])x++;

  x+=joyX;
  y+=joyY;

  const len=Math.hypot(x,y);

  if(len>0){

    x/=len;
    y/=len;

    player.vx=x*player.speed;
    player.vy=y*player.speed;

    player.walk+=dt*10;

    if(Math.abs(x)>Math.abs(y)){
      player.direction=x>0?"right":"left";
    }else{
      player.direction=y>0?"down":"up";
    }

  }else{

    player.vx*=.8;
    player.vy*=.8;

  }

  player.x+=player.vx*dt;
  player.y+=player.vy*dt;

  player.x=Math.max(100,Math.min(WORLD_W-100,player.x));
  player.y=Math.max(100,Math.min(WORLD_H-100,player.y));

  player.anim+=dt;
}


/* =========================================================
   ATTACK
========================================================= */

function attack(){

  if(!running||paused)return;
  if(player.attackCooldown>0)return;

  player.attackTimer=.28;
  player.attackCooldown=.45;

  camera.shake=5;

  for(const m of monsters){

    if(!m.alive)continue;

    if(
      dist(player.x,player.y,m.x,m.y)<95
    ){

      m.hp-=35;

      burst(m.x,m.y,8);

      if(m.hp<=0){

        m.alive=false;

        player.monstersKilled++;

        gainXP(30);

        player.coins+=5;

        message("+5 coins  +30 XP");

      }

    }

  }
}


/* =========================================================
   DASH
========================================================= */

function dash(){

  if(!running||paused)return;
  if(player.dashCooldown>0)return;

  let dx=player.vx;
  let dy=player.vy;

  let len=Math.hypot(dx,dy);

  if(len<1){
    if(player.direction==="left")dx=-1;
    if(player.direction==="right")dx=1;
    if(player.direction==="up")dy=-1;
    if(player.direction==="down")dy=1;

    len=Math.hypot(dx,dy);
  }

  dx/=len;
  dy/=len;

  player.x+=dx*170;
  player.y+=dy*170;

  player.dashCooldown=1.2;

  camera.shake=10;

  burst(player.x,player.y,15);
}


/* =========================================================
   XP
========================================================= */

function gainXP(amount){

  player.xp+=amount;

  while(player.xp>=player.xpMax){

    player.xp-=player.xpMax;

    player.level++;

    player.xpMax=
      Math.floor(player.xpMax*1.35);

    player.maxHp+=15;
    player.hp=player.maxHp;

    message("LEVEL UP!  Level "+player.level);

  }
}


/* =========================================================
   NPC INTERACTION
========================================================= */

function interact(){

  for(const n of npcs){

    if(dist(player.x,player.y,n.x,n.y)<90){

      document.getElementById("dialogueName")
      .textContent=n.name;

      document.getElementById("dialogueText")
      .textContent=n.text;

      document.getElementById("dialogue")
      .style.display="block";

      return;
    }

  }

}


/* =========================================================
   MONSTERS
========================================================= */

function updateMonsters(dt){

  for(const m of monsters){

    if(!m.alive)continue;

    const d=dist(
      player.x,
      player.y,
      m.x,
      m.y
    );

    if(d<450){

      const dx=(player.x-m.x)/d;
      const dy=(player.y-m.y)/d;

      m.x+=dx*m.speed*dt;
      m.y+=dy*m.speed*dt;

      m.anim+=dt*5;

    }

  }

}


/* =========================================================
   PARTICLES
========================================================= */

function burst(x,y,count){

  for(let i=0;i<count;i++){

    const a=Math.random()*Math.PI*2;
    const s=40+Math.random()*120;

    particles.push({
      x,
      y,
      vx:Math.cos(a)*s,
      vy:Math.sin(a)*s,
      life:.5+Math.random()*.5,
      max:.8
    });

  }

}

function updateParticles(dt){

  for(let i=particles.length-1;i>=0;i--){

    const p=particles[i];

    p.x+=p.vx*dt;
    p.y+=p.vy*dt;

    p.vx*=.94;
    p.vy*=.94;

    p.life-=dt;

    if(p.life<=0)
      particles.splice(i,1);

  }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

  const targetX=
    player.x-W/2;

  const targetY=
    player.y-H/2;

  camera.x+=(targetX-camera.x)*Math.min(1,dt*7);
  camera.y+=(targetY-camera.y)*Math.min(1,dt*7);

  camera.x=Math.max(
    0,
    Math.min(WORLD_W-W,camera.x)
  );

  camera.y=Math.max(
    0,
    Math.min(WORLD_H-H,camera.y)
  );

  if(camera.shake>0){
    camera.shake*=.82;
  }

}


/* =========================================================
   DRAW WORLD
========================================================= */

function drawWorld(){

  ctx.fillStyle="#07111a";
  ctx.fillRect(0,0,W,H);

  ctx.save();

  let sx=0;
  let sy=0;

  if(camera.shake>.3){

    sx=(Math.random()-.5)*camera.shake;
    sy=(Math.random()-.5)*camera.shake;

  }

  ctx.translate(
    -Math.floor(camera.x)+sx,
    -Math.floor(camera.y)+sy
  );


  /* ocean */

  ctx.fillStyle="#123d5a";
  ctx.fillRect(0,0,WORLD_W,WORLD_H);


  /* islands */

  for(const island of islands){

    if(!island.unlocked &&
       dist(
         player.x,
         player.y,
         island.x,
         island.y
       )<island.radius+600){

      drawIsland(island,true);

    }else{

      drawIsland(island,false);

    }

  }


  /* trees */

  for(const t of trees){

    const island=islands[t.island];

    if(island.unlocked)
      drawTree(t);

  }


  /* rocks */

  for(const r of rocks){

    const island=islands[r.island];

    if(island.unlocked)
      drawRock(r);

  }


  /* houses */

  drawVillage();


  /* NPC */

  for(const n of npcs)
    drawNPC(n);


  /* monsters */

  for(const m of monsters){

    if(m.alive)
      drawMonster(m);

  }


  /* particles */

  for(const p of particles){

    ctx.globalAlpha=
      Math.max(0,p.life/p.max);

    ctx.fillStyle="#fff2a8";

    ctx.fillRect(
      p.x-3,
      p.y-3,
      6,
      6
    );

  }

  ctx.globalAlpha=1;


  drawPlayer();

  ctx.restore();


  /* island unlock indicator */

  drawIslandIndicators();

}


/* =========================================================
   ISLAND
========================================================= */

function drawIsland(island,locked){

  ctx.beginPath();

  ctx.arc(
    island.x,
    island.y,
    island.radius,
    0,
    Math.PI*2
  );

  ctx.fillStyle=
    locked ? "#344555" : island.color;

  ctx.fill();

  ctx.lineWidth=45;
  ctx.strokeStyle=
    locked ? "#213241" : "#d2b675";

  ctx.stroke();


  /* beach */

  ctx.beginPath();

  ctx.arc(
    island.x,
    island.y,
    island.radius-30,
    0,
    Math.PI*2
  );

  ctx.lineWidth=35;
  ctx.strokeStyle="#d6bd79";
  ctx.stroke();


  /* paths */

  ctx.strokeStyle=
    locked ? "#3c4a52" : "#8c7651";

  ctx.lineWidth=55;

  ctx.beginPath();

  ctx.moveTo(
    island.x-island.radius*.7,
    island.y
  );

  ctx.lineTo(
    island.x+island.radius*.7,
    island.y
  );

  ctx.stroke();

}


/* =========================================================

========================================================= */

function drawVillage(){

  drawHouse(x-300,y-220,150,120);

}

function drawHouse(x,y,w,h){

  ctx.fillRect(

  ctx.fillStyle="#9ed4df";

  ctx.fillRect(
    x+25,
    y+40,
    25,
    25
  );

  ctx.fillRect(
    x+w-50,
    y+40,
    25,
    25
  );

}


/* =========================================================
   TREE
========================================================= */

function drawTree(t){

  ctx.save();

  ctx.translate(t.x,t.y);

  const s=t.size;

  ctx.fillStyle="#4b301e";

  ctx.fillRect(
    -8*s,
    -10*s,
    16*s,
    52*s
  );

  ctx.fillStyle="#183f2b";

  ctx.beginPath();

  ctx.arc(
    0,
    -20*s,
    33*s,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#28613c";

  ctx.beginPath();

  ctx.arc(
    -20*s,
    -2*s,
    25*s,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    20*s,
    -4*s,
    25*s,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

}

/* =========================================================
   ISLAND INDICATORS
========================================================= */

function drawIslandIndicators(){

  for(const island of islands){

    if(island.unlocked)continue;

    const sx=island.x-camera.x;
    const sy=island.y-camera.y;

    if(
      sx<-300||
      sx>W+300||
      sy<-300||
      sy>H+300
    )continue;

    ctx.fillStyle="rgba(0,0,0,.75)";

    ctx.beginPath();

    ctx.arc(
      sx,
      sy,
      70,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="white";
    ctx.font="bold 16px Arial";
    ctx.textAlign="center";

    ctx.fillText(
      "🔒 "+island.name,
      sx,
      sy-5
    );

    ctx.font="12px Arial";

    ctx.fillText(
      "Reach Level "+(island.id*5+3),
      sx,
      sy+18
    );

  }

}


/* =========================================================
   UPDATE
========================================================= */

let last=performance.now();

function loop(now){

  const dt=
    Math.min(.033,(now-last)/1000);

  last=now;

  if(running&&!paused){

    player.attackTimer=
      Math.max(0,player.attackTimer-dt);

    player.attackCooldown=
      Math.max(0,player.attackCooldown-dt);

    player.dashCooldown=
      Math.max(0,player.dashCooldown-dt);

    updateMovement(dt);
    updateMonsters(dt);
    updateParticles(dt);
    updateCamera(dt);

    checkIslandUnlock();

  }

  drawWorld();
  updateHUD();

  requestAnimationFrame(loop);

}

requestAnimationFrame(loop);


/* =========================================================
   ISLAND UNLOCK
========================================================= */

function checkIslandUnlock(){

  for(const island of islands){

    if(island.unlocked)continue;

    const requiredLevel=
      island.id*5+3;

    if(player.level>=requiredLevel){

      island.unlocked=true;

      message(
        "🏝️ "+island.name+
        " UNLOCKED!"
      );

      burst(
        island.x,
        island.y,
        50
      );

    }

  }

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

  document.getElementById("level")

  document.getElementById("coins")
  .textContent=player.coins;

  document.getElementById("xpText")

    (player.hp/player.maxHp*100)+"%";

  document.getElementById("xp")
  .style.width=
    (player.xp/player.xpMax*100)+"%";

}


/* =========================================================
   WINDOWS
========================================================= */

function openWindow(id){

  document.getElementById(id)
  .style.display="block";

}

function closeWindows(){

  document.querySelectorAll(".window")
  .forEach(w=>w.style.display="none");

}


/* =========================================================
   MESSAGE
========================================================= */

let messageTimer;

function message(text){

  const el=
    document.getElementById("message");

  el.textContent=text;
  el.style.display="block";

  clearTimeout(messageTimer);

  messageTimer=setTimeout(()=>{
    el.style.display="none";
  },1800);

}


/* =========================================================
   NEW GAME
========================================================= */

function newGame(){

  localStorage.removeItem("pixelRealmSave");

  player.x=WORLD_W/2;
  player.y=WORLD_H/2;

  player.hp=100;
  player.maxHp=100;

  player.level=1;
  player.xp=0;
  player.xpMax=100;

  player.coins=25;
  player.monstersKilled=0;

  for(let i=0;i<islands.length;i++){
    islands[i].unlocked=i===0;
  }

  startGame();

}


/* =========================================================
   START
========================================================= */

function startGame(){

  running=true;
  paused=false;

  document.getElementById("menu")
  .style.display="none";

  document.getElementById("hud")
  .style.display="block";

  document.getElementById("topButtons")
  .style.display="flex";

  document.getElementById("controls")
  .style.display=
    "ontouchstart" in window
    ? "block"
    : "none";

  generateWorld();

  saveGame();

}


/* =========================================================
   SAVE
========================================================= */

function saveGame(){

  const data={
    x:player.x,
    y:player.y,
    hp:player.hp,
    maxHp:player.maxHp,
    level:player.level,
    xp:player.xp,
    xpMax:player.xpMax,
    coins:player.coins,
    monstersKilled:player.monstersKilled,
    islands:islands.map(i=>i.unlocked)
  };

  localStorage.setItem(
    "pixelRealmSave",
    JSON.stringify(data)
  );

}


/* =========================================================
   LOAD
========================================================= */

function loadGame(){

  const save=
    localStorage.getItem("pixelRealmSave");

  if(!save){

    message("NO SAVE FOUND");

    return;
  }

  const d=JSON.parse(save);

  player.x=d.x;
  player.y=d.y;

  player.hp=d.hp;
  player.maxHp=d.maxHp;

  player.level=d.level;
  player.xp=d.xp;
  player.xpMax=d.xpMax;

  player.coins=d.coins;
  player.monstersKilled=
    d.monstersKilled||0;

  if(d.islands){

    d.islands.forEach(
      (v,i)=>{
        if(islands[i])
          islands[i].unlocked=v;
      }
    );

  }

  startGame();

}


/* autosave */

setInterval(()=>{
  if(running&&!paused)
    saveGame();
},5000);


/* =========================================================
   PAUSE
========================================================= */

function pauseGame(){

  paused=!paused;

  if(paused){

    message("PAUSED");

  }

}


/* =========================================================
   CONTROLS
========================================================= */

function showControls(){

  alert(
`CONTROLS

WASD / ARROWS
Move

SPACE
Attack

E
Talk to NPC

SHIFT
Dash

Mobile:
Joystick = Move
⚔️ = Attack
💨 = Dash`
  );

}


/* =========================================================
   INITIAL
========================================================= */

generateWorld();
